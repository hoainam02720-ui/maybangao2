<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NamRice Auto</title>

<style>

body{

margin:0;
padding:0;
background:#f1f1f1;
font-family:Arial;

}

.header{

background:#00c853;
color:white;
padding:25px;
font-size:40px;
font-weight:bold;
border-radius:0 0 30px 30px;

}

.box{

background:white;
margin:20px;
padding:20px;
border-radius:25px;

}

input,select{

width:100%;
padding:20px;
font-size:30px;
margin-top:15px;
border:none;
border-radius:20px;
background:#f1f1f1;

}

button{

width:100%;
padding:25px;
font-size:35px;
font-weight:bold;
border:none;
border-radius:25px;
margin-top:20px;
color:white;

}

.green{

background:#00c853;

}

.blue{

background:#2962ff;

}

.big{

font-size:70px;
font-weight:bold;
color:#00c853;

}

</style>

</head>

<body>

<div class="header">
🌾 NamRice Auto
</div>

<div class="box">

<h1>🌾 Giao gạo</h1>

<input
id="diachi"
placeholder="Nhập địa chỉ nhận gạo">

<select id="gao">

<option value="180000">
ST25 - 180k / túi
</option>

<option value="220000">
Jasmine - 220k / túi
</option>

</select>

<select id="soluong">

<option value="1">
1 túi - 5kg
</option>

<option value="2">
2 túi - 10kg
</option>

<option value="3">
3 túi - 15kg
</option>

<option value="5">
5 túi - 25kg
</option>

</select>

<button
class="green"
onclick="datgao()">

🌾 ĐẶT GẠO

</button>

<div id="ketqua"></div>

</div>

<script>

function datgao(){

let gia =
Number(
document.getElementById("gao").value
)

let soluong =
Number(
document.getElementById("soluong").value
)

let tong =
gia * soluong

document.getElementById(
"ketqua"
).innerHTML = `

<div class="box">

<h1>🛵 ĐƠN GẠO</h1>

<div class="big">

${tong.toLocaleString()}đ

</div>

<h2>

🌾 ${soluong} túi

</h2>

<h2>

📍 Đang tìm shipper

</h2>

</div>

`

}

</script>

</body>

</html>
