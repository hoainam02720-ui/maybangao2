<!DOCTYPE html><html>
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NamRice Auto</title><link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/><script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script><style>

body{

margin:0;
padding:0;
background:#eceff1;
font-family:Arial;

}

.header{

background:#00c853;
color:white;
padding:30px;
font-size:55px;
font-weight:bold;
border-radius:0 0 40px 40px;

}

.box{

background:white;
margin:25px;
padding:25px;
border-radius:35px;

}

input,select{

width:100%;
padding:25px;
font-size:40px;
margin-top:20px;
border:none;
border-radius:25px;
background:#f1f1f1;
box-sizing:border-box;

}

button{

width:100%;
padding:25px;
font-size:45px;
font-weight:bold;
border:none;
border-radius:25px;
margin-top:20px;
color:white;

}

.green{
background:#00c853;
}

.blue{
background:#2962ff;
}

#map{

height:500px;
border-radius:25px;
margin-top:20px;

}

</style></head><body><div class="header">🌾 NamRice Auto

</div><div class="box"><h1>🚕 Đặt xe</h1><button
class="blue"
onclick="laygps()">

📍 Lấy GPS hiện tại

</button><input
id="pickup"
placeholder="Điểm đón"
/>

<input
id="dropoff"
placeholder="Điểm đến"
/>

<select id="loaixe"><option>Xe máy</option><option>Xe 4 chỗ</option><option>Xe tải</option></select><button
class="green"
onclick="taodon()">

🛒 ĐẶT NGAY

</button><div id="ketqua"></div></div><div class="box"><h1>🗺 GPS Realtime</h1><div id="map"></div></div><script>

let map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map)

let marker =
L.marker(
[10.0452,105.7469]
).addTo(map)

function laygps(){

navigator.geolocation.getCurrentPosition(

function(pos){

let lat =
pos.coords.latitude

let lon =
pos.coords.longitude

document.getElementById("pickup").value =
lat + "," + lon

map.setView(
[lat,lon],
16
)

marker.setLatLng(
[lat,lon]
)

}

)

}

async function taodon(){

let pickup =
document.getElementById("pickup").value

let dropoff =
document.getElementById("dropoff").value

let loaixe =
document.getElementById("loaixe").value

if(!pickup || !dropoff){

alert("Nhập địa chỉ")

return

}

let pick =
await timtoado(pickup)

let drop =
await timtoado(dropoff)

let distance =
getDistanceFromLatLonInKm(

pick.lat,
pick.lon,

drop.lat,
drop.lon

)

let gia = 8000

if(loaixe=="Xe 4 chỗ"){
gia = 13000
}

if(loaixe=="Xe tải"){
gia = 20000
}

let tong =
Math.round(distance * gia)

document.getElementById("ketqua").innerHTML =

`

<div style="
background:#f5f5f5;
padding:25px;
border-radius:25px;
margin-top:20px;
">

<h1>
🚕 ĐƠN ĐẶT XE
</h1>

<div style="
font-size:70px;
color:#00c853;
font-weight:bold;
">

${tong.toLocaleString()}đ

</div>

<br>

📏 Khoảng cách:
${distance.toFixed(1)} km

<br><br>

🚖 Đang tìm tài xế

</div>

`

map.setView(
[drop.lat,drop.lon],
15
)

marker.setLatLng(
[drop.lat,drop.lon]
)

}

async function timtoado(diachi){

if(diachi.includes(",")){

let p =
diachi.split(",")

return{

lat:parseFloat(p[0]),

lon:parseFloat(p[1])

}

}

let url =

"https://nominatim.openstreetmap.org/search?format=json&q="

+ encodeURIComponent(diachi)

let res =
await fetch(url)

let data =
await res.json()

if(data.length==0){

alert("Không tìm thấy địa chỉ")

throw new Error()

}

return{

lat:
parseFloat(data[0].lat),

lon:
parseFloat(data[0].lon)

}

}

function getDistanceFromLatLonInKm(
lat1,
lon1,
lat2,
lon2
){

let R = 6371

let dLat =
deg2rad(lat2-lat1)

let dLon =
deg2rad(lon2-lon1)

let a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(deg2rad(lat1)) *

Math.cos(deg2rad(lat2)) *

Math.sin(dLon/2) *

Math.sin(dLon/2)

let c =

2 * Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
)

return R * c

}

function deg2rad(deg){

return deg *
(Math.PI/180)

}

</script></body>
</html>
