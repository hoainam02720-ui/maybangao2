<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAMRICE AUTO</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:linear-gradient(90deg,#16a34a,#22c55e);
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

h2{
font-size:28px;
}

input,select,button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:18px;
box-sizing:border-box;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
}

.order{
background:#334155;
padding:15px;
border-radius:15px;
margin-top:20px;
}

.history{
background:#14532d;
padding:15px;
border-radius:15px;
margin-top:20px;
}

#gps{
margin-top:15px;
font-size:18px;
color:#4ade80;
}

.red{
background:#dc2626;
}

.blue{
background:#2563eb;
}

.orange{
background:#ea580c;
}

</style>
</head>

<body>

<div class="header">
NAMRICE AUTO
</div>

<div class="container">

<div class="card">

<h2>🛒 KHÁCH ĐẶT GẠO</h2>

<input id="ten" placeholder="Tên khách">

<input id="sdt" placeholder="Số điện thoại">

<input id="diachi" placeholder="Địa chỉ giao hàng">

<select id="gao">
<option>ST25 5KG - 120K</option>
<option>ST25 10KG - 240K</option>
<option>Gạo thơm 5KG - 100K</option>
</select>

<button onclick="datGao()">
ĐẶT GẠO
</button>

</div>

<div class="card">

<h2>🛵 KHÁCH ĐẶT XE / GIAO HÀNG</h2>

<input id="tenxe" placeholder="Tên khách">

<input id="sdtxe" placeholder="Số điện thoại">

<input id="diemdi" placeholder="Điểm đi">

<input id="diemden" placeholder="Điểm đến">

<select id="loaixe">
<option>🛵 Xe máy</option>
<option>🚗 Ô tô 4 chỗ</option>
<option>🚙 Ô tô 7 chỗ</option>
<option>🚚 Giao hàng</option>
<option>🚛 Xe tải nhỏ</option>
</select>

<input id="sokm" type="number" placeholder="Số km dự kiến">

<button class="orange" onclick="datXe()">
ĐẶT XE
</button>

</div>

<div class="card">

<h2>🧺 KHO GẠO</h2>

<div class="order">
📦 Ô A1 - ST25 5KG - ✅ Còn hàng
</div>

<div class="order">
📦 Ô A2 - ST25 10KG - ✅ Còn hàng
</div>

<div class="order">
📦 Ô B1 - Gạo thơm 5KG - ✅ Còn hàng
</div>

</div>

<div class="card">

<h2>🛵 SHIPPER ONLINE</h2>

<button class="blue" onclick="batGPS()">
BẬT GPS NHẬN ĐƠN
</button>

<div id="gps">
GPS chưa bật
</div>

</div>

<div class="card">

<h2>🚚 ĐƠN HÀNG ĐANG CHỜ</h2>

<div id="donhang"></div>

</div>

<div class="card">

<h2>📜 LỊCH SỬ ĐƠN HÀNG</h2>

<div id="lichsu"></div>

</div>

</div>

<script>

let danhSachDon = JSON.parse(localStorage.getItem("donhang")) || []

function luuDon(){
localStorage.setItem(
"donhang",
JSON.stringify(danhSachDon)
)
}

function datGao(){

const ten = document.getElementById("ten").value
const sdt = document.getElementById("sdt").value
const diachi = document.getElementById("diachi").value
const gao = document.getElementById("gao").value

if(ten=="" || sdt=="" || diachi==""){
alert("Nhập đầy đủ thông tin")
return
}

let sotien = 0

if(loaixe == "🛵 Xe máy"){
sotien = sokm * 7000
}

if(loaixe == "🚗 Ô tô 4 chỗ"){
if(sokm <= 2){
sotien = 28000
}else{
sotien = 28000 + ((sokm - 2) * 12000)
}
}

if(loaixe == "🚙 Ô tô 7 chỗ"){
if(sokm <= 2){
sotien = 35000
}else{
sotien = 35000 + ((sokm - 2) * 15000)
}
}

if(loaixe == "🚚 Giao hàng"){
sotien = sokm * 10000
}

if(loaixe == "🚛 Xe tải nhỏ"){
sotien = sokm * 18000
}

const don = {
loai:"xe",
ten,
sdt,
diemdi,
diemden,
loaixe,
sokm,
sotien,
trangthai:"🕒 Chờ tài xế",
hoanthanh:false
}

danhSachDon.push(don)

luuDon()

alert("Đặt xe thành công 🚚")

hienThiDon()

}

function batGPS(){

navigator.geolocation.getCurrentPosition(

(pos)=>{

const lat = pos.coords.latitude
const lon = pos.coords.longitude

document.getElementById("gps").innerHTML =
"📍 GPS: " + lat + " , " + lon

alert("Đã bật online nhận đơn")

},

()=>{
alert("Chưa bật GPS")
}

)

}

function hienThiDon(){

let html = ""
let lichsu = ""



danhSachDon.forEach((don,index)=>{

if(don.hoanthanh == false){

if(don.loai == "gao"){

html += `

<div class="order">

👤 ${don.ten}

<br><br>

📞 <a href="tel:${don.sdt}" style="color:#4ade80;text-decoration:none;">${don.sdt}</a>

<br><br>

🏠 ${don.diachi}

<br><br>

🍚 ${don.gao}

<br><br>

📌 ${don.trangthai}

<br><br>

<button onclick="nhanDon(${index})">
NHẬN ĐƠN
</button>

<button class="orange" onclick="daDen(${index})">
ĐÃ ĐẾN MÁY
</button>

<button onclick="moKho(${index})">
MỞ KHO GẠO
</button>

<button class="blue" onclick="giaoHang(${index})">
ĐI GIAO
</button>

<button class="red" onclick="giaoXong(${index})">
ĐÃ GIAO XONG
</button>

</div>

`

}

if(don.loai == "xe"){

html += `

<div class="order">

👤 ${don.ten}

<br><br>

📞 <a href="tel:${don.sdt}" style="color:#4ade80;text-decoration:none;">${don.sdt}</a>

<br><br>

📍 Điểm đi: ${don.diemdi}

<br><br>

🏁 Điểm đến: ${don.diemden}

<br><br>

🚗 ${don.loaixe}

<br><br>

📏 Khoảng cách: ${don.sokm} km

<br><br>

💰 Giá tiền: ${don.sotien.toLocaleString()}đ

<br><br>

📌 ${don.trangthai}

<br><br>

<button onclick="nhanDonXe(${index})">
NHẬN CUỐC XE
</button>

<button class="orange" onclick="daDenXe(${index})">
ĐÃ ĐẾN ĐÓN KHÁCH
</button>

<button class="blue" onclick="diDiemDen(${index})">
ĐI ĐIỂM ĐẾN
</button>

<button class="red" onclick="hoanThanhXe(${index})">
HOÀN THÀNH CHUYẾN
</button>

</div>

`

}

}else{

lichsu += `

<div class="history">

✅ ${don.ten}

<br><br>

📌 ${don.trangthai}

</div>

`

}

})


document.getElementById("donhang").innerHTML = html

document.getElementById("lichsu").innerHTML = lichsu

}

function nhanDon(index){

danhSachDon[index].trangthai =
"🚚 Đang đến máy lấy gạo"

luuDon()

location.href =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(danhSachDon[index].diachi)

}

function daDen(index){

alert(
"📞 Gọi khách: " + danhSachDon[index].sdt
)

danhSachDon[index].trangthai =
"📍 Đã đến máy bán gạo"

luuDon()

hienThiDon()

}

function moKho(index){

danhSachDon[index].trangthai =
"🔓 Đã mở kho lấy gạo"

alert("Đang mở khóa ô A1 🔓")

luuDon()

hienThiDon()

}

function giaoHang(index){

danhSachDon[index].trangthai =
"🛵 Đang giao hàng"

luuDon()

location.href =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(danhSachDon[index].diachi)

}

function giaoXong(index){

danhSachDon[index].trangthai =
"✅ Giao gạo thành công"

danhSachDon[index].hoanthanh = true

luuDon()

alert("Đã giao hàng xong")

hienThiDon()

}

function nhanDonXe(index){

danhSachDon[index].trangthai =
"🚕 Đang đến đón khách"

luuDon()

location.href =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(danhSachDon[index].diemdi)

}

function daDenXe(index){

alert(
"📞 Gọi khách: " + danhSachDon[index].sdt
)

danhSachDon[index].trangthai =
"📍 Đã đến điểm đón"

luuDon()

hienThiDon()

}

function diDiemDen(index){

danhSachDon[index].trangthai =
"🚗 Đang chở khách"

luuDon()

location.href =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(danhSachDon[index].diemden)

}

function hoanThanhXe(index){

danhSachDon[index].trangthai =
"✅ Hoàn thành chuyến xe"

danhSachDon[index].hoanthanh = true

luuDon()

alert("Đã hoàn thành chuyến xe")

hienThiDon()

}

hienThiDon()

</script>

</body>
</html>
