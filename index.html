<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NamRice Auto</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#eef2f5;
padding-bottom:120px;
}

header{
background:#00c853;
padding:28px;
color:white;
font-size:30px;
font-weight:bold;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
}

.sub{
font-size:18px;
margin-top:10px;
}

.box{
background:white;
margin:15px;
padding:20px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.row{
display:flex;
gap:10px;
margin-bottom:10px;
}

.btn{
flex:1;
padding:18px;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
color:white;
}

.green{
background:#00c853;
}

.blue{
background:#1565ff;
}

.orange{
background:#ff9800;
}

.red{
background:#ff3b30;
}

.dark{
background:#555;
}

input,
select,
textarea{
width:100%;
padding:18px;
border:none;
background:#f1f3f8;
border-radius:18px;
margin-bottom:12px;
font-size:18px;
box-sizing:border-box;
}

.card{
background:#f7f7f7;
padding:18px;
border-radius:20px;
margin-top:12px;
line-height:1.8;
}

.money{
font-size:55px;
font-weight:bold;
color:#00c853;
}

#map{
height:500px;
border-radius:25px;
margin-top:15px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -5px 20px rgba(0,0,0,.1);
}

.slide{
width:100%;
}

</style>
</head>

<body>

<header>

🌾 NamRice Auto

<div class="sub">
Đặt xe • Giao gạo • Chở hàng • GPS realtime
</div>

</header>

<!-- DAT DON -->

<div class="box">

<div class="title">
🛒 Đặt đơn
</div>

<div class="row">

<button class="btn green" onclick="chon('gao')">
🌾 Giao gạo
</button>

<button class="btn blue" onclick="chon('xe')">
🚖 Đặt xe
</button>

</div>

<div class="row">

<button class="btn orange" onclick="chon('hang')">
📦 Chở hàng
</button>

</div>

<input id="sdt" placeholder="📞 Số điện thoại khách">

<!-- FORM GAO -->

<div id="formgao">

<select id="loaigao">

<option value="18000">
🌾 ST25 - 18k/kg
</option>

<option value="22000">
🌾 Gạo Nhật - 22k/kg
</option>

</select>

<input
id="kg"
type="number"
value="5"
placeholder="🌾 Số kg"
>

<select id="shipgao">

<option value="8000">
🛵 Xe máy - 8k/km
</option>

<option value="13000">
🚗 Xe 4 chỗ - 13k/km
</option>

<option value="14000">
🚙 Xe 6 chỗ - 14k/km
</option>

</select>

<input
id="diachigao"
placeholder="📍 Địa chỉ giao gạo"
>

</div>

<!-- FORM XE -->

<div id="formxe" style="display:none">

<button
class="btn blue"
onclick="layvitri()"
>
📍 Chia sẻ vị trí đón
</button>

<br><br>

<input
id="diemdon"
placeholder="📍 Điểm đón"
>

<input
id="diemden"
placeholder="🏁 Điểm đến"
>

<select id="loaixe">

<option value="8000">
🛵 Xe máy - 8k/km
</option>

<option value="13000">
🚗 Xe 4 chỗ - 13k/km
</option>

<option value="14000">
🚙 Xe 6 chỗ - 14k/km
</option>

</select>

</div>

<!-- FORM HANG -->

<div id="formhang" style="display:none">

<button
class="btn orange"
onclick="layvitri()"
>
📍 Chia sẻ vị trí lấy hàng
</button>

<br><br>

<input
id="layhang"
placeholder="📦 Điểm lấy hàng"
>

<input
id="giaohang"
placeholder="🏁 Điểm giao hàng"
>

<select id="xehang">

<option value="13000">
🚚 500kg - 13k/km
</option>

<option value="14000">
🚛 1 tấn - 14k/km
</option>

<option value="16000">
🚛 2.5 tấn - 16k/km
</option>

<option value="18000">
🚛 3.5 tấn - 18k/km
</option>

</select>

</div>

<select>

<option>
💵 Tiền mặt
</option>

<option>
🏦 Chuyển khoản
</option>

</select>

<button
class="btn green"
onclick="datdon()"
>
🛒 ĐẶT NGAY
</button>

<div class="card" id="bill">
Chưa có đơn
</div>

</div>

<!-- DON CHO NHAN -->

<div class="box">

<div class="title">
📦 Đơn đang chờ nhận
</div>

<div id="doncho">
Chưa có đơn
</div>

</div>

<!-- SHIPPER -->

<div class="box">

<div class="title">
🛵 Shipper
</div>

<div class="row">

<button
class="btn blue"
onclick="daden()"
>
📍 Đã đến
</button>

<button
class="btn orange"
onclick="laygao()"
>
🌾 Lấy hàng
</button>

</div>

<div class="row">

<button
class="btn green"
onclick="digiao()"
>
🚚 Đi giao
</button>

<button
class="btn red"
onclick="mogooogle()"
>
🗺️ Maps
</button>

</div>

<button
class="btn dark"
onclick="hoanthanh()"
>
✅ Hoàn thành
</button>

<div class="card" id="shipstatus">

🚚 Đang chờ nhận đơn

</div>

</div>

<!-- VI -->

<div class="box">

<div class="title">
💰 Ví shipper
</div>

<div class="money">
245.000đ
</div>

<br>

📈 Hôm nay: 7 chuyến

<br>

💸 Hoa hồng: 15%

<br>

🏦 Phí hệ thống: 1.5%

<br>

💵 Shipper nhận: 83.5%

</div>

<!-- MAP -->

<div class="box">

<div class="title">
🗺️ GPS realtime
</div>

<div id="map"></div>

</div>

<!-- MENU -->

<div class="bottom">

<div>🏠</div>
<div>📦</div>
<div>🛵</div>
<div>💰</div>
<div>⚙️</div>

</div>

<script>

let current = "gao"

let tong = 0
let km = 0

let currentLat = 10.0452
let currentLon = 105.7469

const map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

let marker =
L.marker([10.0452,105.7469])
.addTo(map)

navigator.geolocation.watchPosition((pos)=>{

currentLat =
pos.coords.latitude

currentLon =
pos.coords.longitude

marker.setLatLng([
currentLat,
currentLon
])

map.setView([
currentLat,
currentLon
],15)

})

function chon(loai){

current = loai

document.getElementById(
"formgao"
).style.display = "none"

document.getElementById(
"formxe"
).style.display = "none"

document.getElementById(
"formhang"
).style.display = "none"

if(loai=="gao"){
document.getElementById(
"formgao"
).style.display = "block"
}

if(loai=="xe"){
document.getElementById(
"formxe"
).style.display = "block"
}

if(loai=="hang"){
document.getElementById(
"formhang"
).style.display = "block"
}

}

function layvitri(){

navigator.geolocation.getCurrentPosition((pos)=>{

let lat =
pos.coords.latitude

let lon =
pos.coords.longitude

document.getElementById(
"diemdon"
).value =
lat + "," + lon

})

}

function tinhkhoangcach(){

return (
Math.random()*8 + 2
).toFixed(1)

}

function datdon(){

km =
tinhkhoangcach()

let phi = 0
let hoahong = 0
let shipper = 0

// GIAO GAO

if(current=="gao"){

let gia =
Number(
document.getElementById(
"loaigao"
).value
)

let kg =
Number(
document.getElementById(
"kg"
).value
)

let ship =
Number(
document.getElementById(
"shipgao"
).value
)

let tiengao =
gia * kg

let tienship =
ship * km

tong =
tiengao + tienship

hoahong =
tong * 0.15

phi =
tong * 0.015

shipper =
tong - hoahong - phi

document.getElementById(
"bill"
).innerHTML =

`
🌾 ĐƠN GIAO GẠO

<br><br>

<div class="money">
${Math.floor(tong).toLocaleString()}đ
</div>

📏 Khoảng cách:
${km} km

<br><br>

🌾 Tiền gạo:
${Math.floor(tiengao).toLocaleString()}đ

<br><br>

🚚 Phí ship:
${Math.floor(tienship).toLocaleString()}đ

<br><br>

💸 Hoa hồng:
${Math.floor(hoahong).toLocaleString()}đ

<br><br>

🏦 Phí hệ thống:
${Math.floor(phi).toLocaleString()}đ

<br><br>

🛵 Shipper nhận:
${Math.floor(shipper).toLocaleString()}đ
`

document.getElementById(
"doncho"
).innerHTML =

`
<div class="card">

🌾 Đơn giao gạo

<br><br>

📍 Máy bán gạo A4

<br>

🏁
${document.getElementById("diachigao").value}

<br>

📏 ${km} km

<br>

💵 ${Math.floor(tong).toLocaleString()}đ

<br><br>

<button class="btn blue">
📥 Nhận đơn giao gạo
</button>

</div>
`

}

// DAT XE

if(current=="xe"){

let giaxe =
Number(
document.getElementById(
"loaixe"
).value
)

tong =
giaxe * km

hoahong =
tong * 0.15

phi =
tong * 0.015

shipper =
tong - hoahong - phi

document.getElementById(
"bill"
).innerHTML =

`
🚖 ĐƠN ĐẶT XE

<br><br>

<div class="money">
${Math.floor(tong).toLocaleString()}đ
</div>

📏 Khoảng cách:
${km} km

<br><br>

💸 Hoa hồng:
${Math.floor(hoahong).toLocaleString()}đ

<br><br>

🏦 Phí hệ thống:
${Math.floor(phi).toLocaleString()}đ

<br><br>

🛵 Tài xế nhận:
${Math.floor(shipper).toLocaleString()}đ
`

document.getElementById(
"doncho"
).innerHTML =

`
<div class="card">

🚖 Đơn đặt xe

<br><br>

📍
${document.getElementById("diemdon").value}

<br>

🏁
${document.getElementById("diemden").value}

<br>

📏 ${km} km

<br>

💵 ${Math.floor(tong).toLocaleString()}đ

<br><br>

<button class="btn blue">
📥 Nhận cuốc xe
</button>

</div>
`

}

// CHO HANG

if(current=="hang"){

let giahang =
Number(
document.getElementById(
"xehang"
).value
)

tong =
giahang * km

hoahong =
tong * 0.15

phi =
tong * 0.015

shipper =
tong - hoahong - phi

document.getElementById(
"bill"
).innerHTML =

`
📦 ĐƠN CHỞ HÀNG

<br><br>

<div class="money">
${Math.floor(tong).toLocaleString()}đ
</div>

📏 Khoảng cách:
${km} km

<br><br>

💸 Hoa hồng:
${Math.floor(hoahong).toLocaleString()}đ

<br><br>

🏦 Phí hệ thống:
${Math.floor(phi).toLocaleString()}đ

<br><br>

🚚 Tài xế nhận:
${Math.floor(shipper).toLocaleString()}đ
`

document.getElementById(
"doncho"
).innerHTML =

`
<div class="card">

📦 Đơn chở hàng

<br><br>

📍
${document.getElementById("layhang").value}

<br>

🏁
${document.getElementById("giaohang").value}

<br>

📏 ${km} km

<br>

💵 ${Math.floor(tong).toLocaleString()}đ

<br><br>

<button class="btn blue">
📥 Nhận đơn chở hàng
</button>

</div>
`

}

}

function daden(){

document.getElementById(
"shipstatus"
).innerHTML =

`
📍 Đã tới nơi lấy hàng
`

}

function laygao(){

fetch("/mo")

document.getElementById(
"shipstatus"
).innerHTML =

`
🌾 ESP32 đã mở khóa

<br><br>

🪣 Đang lấy gạo
`

}

function digiao(){

window.open(
"https://www.google.com/maps"
)

document.getElementById(
"shipstatus"
).innerHTML =

`
🚚 Đang giao hàng realtime
`

}

function mogooogle(){

window.open(
"https://www.google.com/maps"
)

}

function hoanthanh(){

document.getElementById(
"shipstatus"
).innerHTML =

`
💵 Tổng tiền khách trả

<br><br>

<div class="money">
${Math.floor(tong).toLocaleString()}đ
</div>

<br>

➡️ Kéo để hoàn thành

<br><br>

<input
class="slide"
type="range"
min="0"
max="100"
value="0"
oninput="checkdone(this.value)"
>
`

}

function checkdone(v){

if(v>=100){

document.getElementById(
"shipstatus"
).innerHTML =

`
✅ Giao thành công

<br><br>

💰 Đã cộng tiền vào ví shipper
`

}

}

</script>

</body>
</html>
