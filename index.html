<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NamRice Auto</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{

margin:0;
font-family:Arial;
background:#edf1f4;

}

.header{

background:#00c853;
color:white;
padding:30px;
font-size:45px;
font-weight:bold;
border-bottom-left-radius:30px;
border-bottom-right-radius:30px;

}

.box{

background:white;
margin:20px;
padding:20px;
border-radius:30px;

}

input,
select{

width:100%;
padding:20px;
font-size:20px;
border:none;
border-radius:20px;
margin-top:15px;
background:#f1f1f1;
box-sizing:border-box;

}

button{

width:100%;
padding:22px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:20px;
margin-top:15px;
color:white;

}

.green{

background:#00c853;

}

.blue{

background:#2962ff;

}

.orange{

background:orange;

}

.red{

background:#ff3d00;

}

.gray{

background:#555;

}

.big{

font-size:70px;
font-weight:bold;
color:#00c853;
word-break:break-word;

}

#map{

height:400px;
border-radius:20px;
margin-top:20px;

}

</style>
</head>

<body>

<div class="header">

🌾 NamRice Auto

</div>

<div class="box">

<h1>🛒 Đặt đơn</h1>

<button
class="green"
onclick="mode='gao'"
>

🌾 Giao gạo

</button>

<button
class="blue"
onclick="mode='xe'"
>

🚕 Đặt xe

</button>

<input
id="pickup"
value="đường A4 cần thơ"
style="display:none"
>

<input
id="dropoff"
placeholder="📍 Điểm đến"
>

<select id="loaixe">

<option value="8000">
🛵 Xe máy - 8k/km
</option>

<option value="13000">
🚗 Xe 4 chỗ - 13k/km
</option>

<option value="18000">
🚙 Xe 7 chỗ - 18k/km
</option>

</select>

<select id="loaigao">

<option value="18000">
🌾 ST25 - 18k/kg
</option>

<option value="22000">
🌾 Jasmine - 22k/kg
</option>

</select>

<input
id="kg"
type="number"
placeholder="Số kg gạo"
value="5"
>

<button
class="green"
onclick="taodon()"
>

🛒 ĐẶT NGAY

</button>

<div
id="ketqua"
style="
margin-top:20px;
font-size:22px;
"
>

Chưa có đơn

</div>

</div>

<div class="box">

<h1>🗺 GPS Realtime</h1>

<div id="map"></div>

</div>

<div class="box">

<h1>🛵 Shipper</h1>

<button
class="blue"
onclick="daden()"
>

📍 Đã đến

</button>

<button
class="orange"
onclick="layhang()"
>

🌾 Lấy hàng

</button>

<button
class="green"
onclick="digiao()"
>

🚚 Đi giao

</button>

<button
class="red"
onclick="openMaps()"
>

🗺 Maps

</button>

<button
class="gray"
onclick="hoanthanh()"
>

✅ Hoàn thành

</button>

<div
id="shipstatus"
style="
margin-top:20px;
font-size:22px;
"
>

🚚 Đang chờ nhận đơn

</div>

</div>

<div class="box">

<h1>💰 Ví shipper</h1>

<div
id="vi"
class="big"
>

250.000đ

</div>

</div>

<script>

let mode = "gao"

let currentDon = null

let wallet = 250000

let map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map)

async function getLatLon(diachi){

let url =
"https://nominatim.openstreetmap.org/search?format=json&q="
+
encodeURIComponent(diachi)

let res =
await fetch(url)

let data =
await res.json()

if(data.length==0){

throw "Không tìm được"

}

return {

lat:parseFloat(data[0].lat),
lon:parseFloat(data[0].lon)

}

}

async function taodon(){

try{

let pickup =
"đường A4 cần thơ"

let dropoff =
document.getElementById(
"dropoff"
).value

if(!dropoff){

alert("Nhập điểm đến")
return

}

let p1 =
await getLatLon(pickup)

let p2 =
await getLatLon(dropoff)

let routeUrl =
`https://router.project-osrm.org/route/v1/driving/${p1.lon},${p1.lat};${p2.lon},${p2.lat}?overview=full&geometries=geojson`

let response =
await fetch(routeUrl)

let data =
await response.json()

if(!data.routes[0]){

alert("Không tìm được đường")
return

}

let route =
data.routes[0]

let km =
(route.distance/1000).toFixed(1)

let gia =
parseInt(
document.getElementById(
"loaixe"
).value
)

let tong =
Math.round(km * gia)

if(mode=="gao"){

let kg =
parseInt(
document.getElementById(
"kg"
).value
)

let giagao =
parseInt(
document.getElementById(
"loaigao"
).value
)

tong += kg * giagao

}

currentDon = {

tong:tong,
km:km

}

window.mapLink =
`https://www.google.com/maps/dir/${p1.lat},${p1.lon}/${p2.lat},${p2.lon}`

document.getElementById(
"ketqua"
).innerHTML = `

🚕 ĐƠN ĐẶT XE

<br><br>

<div class="big">

${tong.toLocaleString()}đ

</div>

<br>

📏 Khoảng cách thật:
${km} km

<br><br>

🚚 Đang tìm tài xế

<br><br>

<button
onclick="openMaps()"
class="blue"
>

🗺 Chỉ đường thật

</button>

`

map.eachLayer((layer)=>{

if(
layer instanceof L.Marker ||
layer instanceof L.Polyline
){

map.removeLayer(layer)

}

})

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map)

L.marker([
p1.lat,
p1.lon
]).addTo(map)

L.marker([
p2.lat,
p2.lon
]).addTo(map)

let coords =
route.geometry.coordinates.map(c=>[
c[1],
c[0]
])

L.polyline(coords,{
color:'blue',
weight:6
}).addTo(map)

map.fitBounds(coords)

}catch(e){

alert("Không tìm được địa chỉ")

}

}

function openMaps(){

window.open(
window.mapLink,
"_blank"
)

}

function daden(){

document.getElementById(
"shipstatus"
).innerHTML =
"📍 Đã đến nơi"

}

function layhang(){

document.getElementById(
"shipstatus"
).innerHTML =
"🌾 Đã lấy hàng"

}

function digiao(){

document.getElementById(
"shipstatus"
).innerHTML =
"🚚 Đang giao hàng"

}

function hoanthanh(){

if(!currentDon){

alert("Chưa có đơn")
return

}

let tong =
currentDon.tong

let tru =
tong * 0.165

let nhan =
tong - tru

wallet += nhan

document.getElementById(
"vi"
).innerHTML =
Math.round(wallet).toLocaleString()
+
"đ"

document.getElementById(
"shipstatus"
).innerHTML = `

✅ Giao thành công

<br><br>

💵 Đã thu:
${tong.toLocaleString()}đ

<br><br>

💸 Trừ phí:
${Math.round(tru).toLocaleString()}đ

<br><br>

💰 Shipper nhận:
${Math.round(nhan).toLocaleString()}đ

`

}

</script>

</body>
</html>
