<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Máy Bán Gạo Online</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

.header{
background:linear-gradient(135deg,#0f9b0f,#38ef7d);
color:white;
padding:30px;
text-align:center;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:15px;
}

h2{
margin-top:15px;
color:green;
}

.price{
font-size:28px;
font-weight:bold;
margin:15px 0;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
color:white;
font-size:18px;
}

.qr{
background:green;
}

.send{
background:red;
}

.footer{
text-align:center;
padding:20px;
margin-top:30px;
}

</style>

</head>

<body>

<div class="header">

<h1>🌾 Máy Bán Gạo Online</h1>

<p>Gạo sạch Vĩnh Long</p>

</div>

<div class="container">

<div class="card">

<img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?q=80&w=1200&auto=format&fit=crop">

<h2>Gạo ST25</h2>

<p>Gạo thơm dẻo cao cấp.</p>

<div class="price">120.000đ</div>

<form action="https://formspree.io/f/mvzlvwpn" method="POST">

<input type="hidden" name="sanpham" value="Gạo ST25">

<input type="text" name="ten" placeholder="Tên khách hàng" required>

<input type="text" name="sdt" placeholder="Số điện thoại" required>

<textarea name="diachi" placeholder="Địa chỉ giao hàng" required></textarea>

<a href="https://img.vietqr.io/image/sacombank-070122688893-compact2.png?amount=120000&addInfo=Mua%20gao%20ST25&accountName=TRAN%20HOAI%20NAM" target="_blank">

<button type="button" class="qr">
Thanh toán QR
</button>

</a>

<button type="submit" class="send">
Gửi đơn hàng
</button>

</form>

</div>

</div>

<div class="footer">
© Trần Hoài Nam
</div>

</body>
</html>
