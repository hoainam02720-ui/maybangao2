<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NamRice Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
margin:0;
font-family:Arial;
}

.top{
padding:10px;
background:white;
z-index:1000;
}

input{
padding:10px;
width:180px;
}

button{
padding:10px;
}

#map{
height:85vh;
width:100%;
}
</style>
</head>

<body>

<div class="top">

<input id="from" placeholder="Điểm đi">

<input id="to" placeholder="Điểm đến">

<button onclick="calculate()">
TÍNH KHOẢNG CÁCH
</button>

<h2 id="distance"></h2>

</div>

<div id="map"></div>

<script>

var map = L.map('map').setView([10.0452,105.7469],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

var marker1;
var marker2;
var routeLine;

async function calculate(){

let from =
document.getElementById("from").value;

let to =
document.getElementById("to").value;

let res1 =
await fetch(
'https://nominatim.openstreetmap.org/search?format=json&q='
+ from
);

let data1 = await res1.json();

let res2 =
await fetch(
'https://nominatim.openstreetmap.org/search?format=json&q='
+ to
);

let data2 = await res2.json();

if(data1.length==0 || data2.length==0){
alert("Không tìm thấy địa điểm");
return;
}

let lat1 = parseFloat(data1[0].lat);
let lon1 = parseFloat(data1[0].lon);

let lat2 = parseFloat(data2[0].lat);
let lon2 = parseFloat(data2[0].lon);

if(marker1) map.removeLayer(marker1);
if(marker2) map.removeLayer(marker2);
if(routeLine) map.removeLayer(routeLine);

marker1 =
L.marker([lat1,lon1]).addTo(map);

marker2 =
L.marker([lat2,lon2]).addTo(map);

routeLine =
L.polyline(
[
[lat1,lon1],
[lat2,lon2]
],
{
color:'blue'
}
).addTo(map);

map.fitBounds(routeLine.getBounds());

let distance =
map.distance(
[lat1,lon1],
[lat2,lon2]
)/1000;

document.getElementById("distance")
.innerHTML =
"Khoảng cách: "
+ distance.toFixed(2)
+ " km";

}

</script>

</body>
</html>
