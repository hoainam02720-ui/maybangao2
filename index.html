<!-- ========================= -->
<!-- APP KHÁCH NAMRICE -->
<!-- CHỨC NĂNG ĐẶT XE -->
<!-- ========================= -->

<div class="khach-dat-xe">

  <!-- TIÊU ĐỀ -->
  <h2>ĐẶT XE NAMRICE</h2>

  <!-- ========================= -->
  <!-- NHẬP ĐIỂM ĐÓN -->
  <!-- pickup_address -->
  <!-- ========================= -->

  <input
    id="diem_don"
    placeholder="Nhập điểm đón"
  >

  <!-- ========================= -->
  <!-- NHẬP ĐIỂM ĐẾN -->
  <!-- dropoff_address -->
  <!-- ========================= -->

  <input
    id="diem_den"
    placeholder="Nhập điểm đến"
  >

  <!-- ========================= -->
  <!-- CHỌN LOẠI XE -->
  <!-- vehicle_type -->
  <!-- ========================= -->

  <select id="loai_xe">

    <!-- XE MÁY -->
    <option value="7000">
      Xe máy
    </option>

    <!-- Ô TÔ 4 CHỖ -->
    <option value="12000">
      Ô tô 4 chỗ
    </option>

    <!-- Ô TÔ 7 CHỖ -->
    <option value="15000">
      Ô tô 7 chỗ
    </option>

  </select>

  <!-- ========================= -->
  <!-- NÚT TÍNH GIÁ -->
  <!-- TINH_GIA_CUOC -->
  <!-- ========================= -->

  <button onclick="tinhGiaCuoc()">

    TÍNH GIÁ

  </button>

  <!-- ========================= -->
  <!-- HIỆN KHOẢNG CÁCH -->
  <!-- distance_km -->
  <!-- ========================= -->

  <div id="hien_khoang_cach"></div>

  <!-- ========================= -->
  <!-- HIỆN GIÁ TIỀN -->
  <!-- price_total -->
  <!-- ========================= -->

  <div id="hien_gia_tien"></div>

</div>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>

  // =========================
  // CHỨC NĂNG:
  // TÍNH GIÁ CƯỚC
  // =========================

  async function tinhGiaCuoc() {

    // =========================
    // LẤY ĐIỂM ĐÓN
    // pickup_address
    // =========================

    const diemDon =
      document.getElementById("diem_don").value;

    // =========================
    // LẤY ĐIỂM ĐẾN
    // dropoff_address
    // =========================

    const diemDen =
      document.getElementById("diem_den").value;

    // =========================
    // LẤY LOẠI XE
    // vehicle_type
    // =========================

    const giaMoiKm =
      Number(
        document.getElementById("loai_xe").value
      );

    // =========================
    // TEST GIẢ KHOẢNG CÁCH
    // distance_km
    // SAU NÀY ĐỔI GPS THẬT
    // =========================

    const khoangCach = 7.2;

    // =========================
    // TÍNH GIÁ TIỀN
    // price_total
    // =========================

    const tongTien =
      khoangCach * giaMoiKm;

    // =========================
    // HIỆN KHOẢNG CÁCH
    // =========================

    document.getElementById(
      "hien_khoang_cach"
    ).innerHTML = `

      Khoảng cách:
      ${khoangCach} km

    `;

    // =========================
    // HIỆN GIÁ TIỀN
    // =========================

    document.getElementById(
      "hien_gia_tien"
    ).innerHTML = `

      Giá tiền:
      ${tongTien.toLocaleString()}đ

    `;

    // =========================
    // GỬI DỮ LIỆU LÊN SERVER
    // KHACH_DAT_XE
    // =========================

    console.log({

      pickup_address: diemDon,

      dropoff_address: diemDen,

      vehicle_type:
        document.getElementById("loai_xe").value,

      distance_km: khoangCach,

      price_total: tongTien

    });

  }

</script>
