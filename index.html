<script>

let current = "gao"
let tong = 0
let km = 0

function chonloai(loai){

current = loai

document.getElementById("formgao").style.display = "none"
document.getElementById("formxe").style.display = "none"
document.getElementById("formhang").style.display = "none"

if(loai=="gao"){
document.getElementById("formgao").style.display = "block"
}

if(loai=="xe"){
document.getElementById("formxe").style.display = "block"
}

if(loai=="hang"){
document.getElementById("formhang").style.display = "block"
}

}

function tinhkm(){

return Math.floor(Math.random()*10)+3

}

function datdon(){

km = tinhkm()

let phiHeThong = 0
let hoaHong = 0
let shipperNhan = 0

// GIAO GẠO
if(current=="gao"){

let giaGao =
Number(document.getElementById("giaGao").value)

let kg =
Number(document.getElementById("kggao").value)

let giaShip =
Number(document.getElementById("xegao").value)

let tiengao =
giaGao * kg

let tienship =
giaShip * km

tong =
tiengao + tienship

hoaHong = tong * 0.15
phiHeThong = tong * 0.015
shipperNhan = tong - hoaHong - phiHeThong

document.getElementById("bill").innerHTML =

`
🌾 ĐƠN GIAO GẠO

<h1 style="color:#00c853">
${tong.toLocaleString()}đ
</h1>

📏 Khoảng cách:
${km} km

<br><br>

🌾 Tiền gạo:
${tiengao.toLocaleString()}đ

<br><br>

🚚 Phí ship:
${tienship.toLocaleString()}đ

<br><br>

💸 Hoa hồng:
${Math.floor(hoaHong).toLocaleString()}đ

<br><br>

🏦 Phí hệ thống:
${Math.floor(phiHeThong).toLocaleString()}đ

<br><br>

🛵 Shipper nhận:
${Math.floor(shipperNhan).toLocaleString()}đ

<br><br>

📦 Đang tìm shipper
`

document.getElementById("doncho").innerHTML =

`
<div class="card">

🌾 Đơn giao gạo

<br><br>

📍 Máy bán gạo A4

<br><br>

🏁
${document.getElementById("diachigiao").value}

<br><br>

📏 ${km} km

<br><br>

💵 ${tong.toLocaleString()}đ

<br><br>

<button onclick="nhandon()" class="btnblue">
📥 Nhận đơn
</button>

</div>
`

}

// ĐẶT XE
if(current=="xe"){

let giaxe =
Number(document.getElementById("loaixe").value)

tong =
giaxe * km

hoaHong = tong * 0.15
phiHeThong = tong * 0.015
shipperNhan = tong - hoaHong - phiHeThong

document.getElementById("bill").innerHTML =

`
🚖 ĐƠN ĐẶT XE

<h1 style="color:#00c853">
${tong.toLocaleString()}đ
</h1>

📏 Khoảng cách:
${km} km

<br><br>

💸 Hoa hồng:
${Math.floor(hoaHong).toLocaleString()}đ

<br><br>

🏦 Phí hệ thống:
${Math.floor(phiHeThong).toLocaleString()}đ

<br><br>

🛵 Tài xế nhận:
${Math.floor(shipperNhan).toLocaleString()}đ

<br><br>

🚕 Đang tìm tài xế
`

document.getElementById("doncho").innerHTML =

`
<div class="card">

🚖 Đơn đặt xe

<br><br>

📍
${document.getElementById("diemdon").value}

<br><br>

🏁
${document.getElementById("diemden").value}

<br><br>

📏 ${km} km

<br><br>

💵 ${tong.toLocaleString()}đ

<br><br>

<button onclick="nhandon()" class="btnblue">
📥 Nhận cuốc xe
</button>

</div>
`

}

// CHỞ HÀNG
if(current=="hang"){

let giahang =
Number(document.getElementById("xetai").value)

tong =
giahang * km

hoaHong = tong * 0.15
phiHeThong = tong * 0.015
shipperNhan = tong - hoaHong - phiHeThong

document.getElementById("bill").innerHTML =

`
📦 ĐƠN CHỞ HÀNG

<h1 style="color:#00c853">
${tong.toLocaleString()}đ
</h1>

📏 Khoảng cách:
${km} km

<br><br>

💸 Hoa hồng:
${Math.floor(hoaHong).toLocaleString()}đ

<br><br>

🏦 Phí hệ thống:
${Math.floor(phiHeThong).toLocaleString()}đ

<br><br>

🚛 Tài xế nhận:
${Math.floor(shipperNhan).toLocaleString()}đ

<br><br>

🚚 Đang tìm xe tải
`

document.getElementById("doncho").innerHTML =

`
<div class="card">

📦 Đơn chở hàng

<br><br>

📍
${document.getElementById("layhang").value}

<br><br>

🏁
${document.getElementById("giaohang").value}

<br><br>

📏 ${km} km

<br><br>

💵 ${tong.toLocaleString()}đ

<br><br>

<button onclick="nhandon()" class="btnblue">
📥 Nhận đơn hàng
</button>

</div>
`

}

}

function nhandon(){

document.getElementById("shipper").innerHTML =

`
<div class="card">

<h2>🛵 Shipper</h2>

<button class="btnblue"
onclick="dadentoimay()">
📍 Đã đến
</button>

<button class="btngreen"
onclick="laygao()">
🌾 Lấy hàng
</button>

<button class="btnred"
onclick="giaohang()">
🚚 Đi giao
</button>

<button class="btnblack"
onclick="maps()">
🗺️ Google Maps
</button>

<button class="btnblack"
onclick="goikhach()">
📞 Gọi khách
</button>

<button class="btngreen"
onclick="hoanthanh()">
✅ Hoàn thành
</button>

<div id="shipstatus">

🚚 Đang di chuyển realtime

</div>

</div>
`

}

function dadentoimay(){

document.getElementById("shipstatus").innerHTML =

`
📍 Đã tới nơi lấy hàng
`

}

function laygao(){

fetch("/mo")

document.getElementById("shipstatus").innerHTML =

`
🌾 ESP32 đã mở khóa

<br><br>

🪣 Gạo đang rơi xuống
`

}

function giaohang(){

window.open(
"https://www.google.com/maps"
)

document.getElementById("shipstatus").innerHTML =

`
🚚 Đang giao hàng realtime
`

}

function maps(){

window.open(
"https://www.google.com/maps"
)

}

function goikhach(){

window.location.href =
"tel:0376034880"

}

function hoanthanh(){

document.getElementById("shipstatus").innerHTML =

`
💵 Tổng tiền khách trả

<h1 style="color:#00c853">
${tong.toLocaleString()}đ
</h1>

➡️ Kéo thanh bên dưới để hoàn thành

<br><br>

<input
type="range"
min="0"
max="100"
value="0"
style="width:100%"
oninput="checkdone(this.value)"
>
`

}

function checkdone(v){

if(v>=100){

document.getElementById("shipstatus").innerHTML =

`
✅ Giao thành công

<br><br>

💰 Đã cộng tiền vào ví shipper
`

}

}

</script>
