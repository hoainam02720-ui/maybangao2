<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NamRice Auto</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#edf1f4;
padding-bottom:100px;
}

header{
background:#00c853;
padding:25px;
color:white;
font-size:28px;
font-weight:bold;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
}

.box{
background:white;
margin:15px;
padding:20px;
border-radius:25px;
}

input,select{
width:100%;
padding:18px;
font-size:18px;
border:none;
border-radius:18px;
background:#f1f3f6;
margin-top:12px;
box-sizing:border-box;
}

button{
width:100%;
border:none;
padding:18px;
border-radius:18px;
font-size:20px;
font-weight:bold;
color:white;
margin-top:12px;
}

.blue{
background:#1565ff;
}

.green{
background:#00c853;
}

.card{
background:#f5f7fb;
padding:20px;
border-radius:20px;
margin-top:20px;
font-size:20px;
}

.big{
font-size:50px;
font-weight:bold;
color:#00c853;
}

#map{
height:400px;
border-radius:20px;
margin-top:20px;
}

</style>
</head>

<body>

<header>

🌾 NamRice Auto

</header>

<div class="box">

<h2>🛒 Đặt xe</h2>

<button class="blue"
onclick="laygps()">

📍 Lấy GPS hiện tại

</button>

<input
id="pickup"
placeholder="Điểm đón"
>

<input
id="destination"
placeholder="Điểm đến VD: Bến Ninh Kiều"
>

<select id="vehicle">

<option value="8000">
🛵 Xe máy - 8k/km
</option>

<option value="13000">
🚗 Xe 4 chỗ - 13k/km
</option>

<option value="15000">
🚙 Xe 7 chỗ - 15k/km
</option>

</select>

<button class="green"
onclick="taodon()">

🛒 ĐẶT NGAY

</button>

<div class="card" id="result">

Chưa có đơn

</div>

</div>

<div class="box">

<h2>🗺 GPS Realtime</h2>

<div id="map"></div>

</div>

<script>

let map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map)

let marker = null

function laygps(){

navigator.geolocation.getCurrentPosition(

(pos)=>{

let lat =
pos.coords.latitude

let lon =
pos.coords.longitude

document.getElementById(
"pickup"
).value =
lat + "," + lon

if(marker){

map.removeLayer(marker)

}

marker =
L.marker([lat,lon]).addTo(map)

map.setView([lat,lon],15)

}

)

}

async function timtoado(place){

let url =

`https://nominatim.openstreetmap.org/search?format=json&q=${place}`

let res =
await fetch(url)

let data =
await res.json()

return {

lat:data[0].lat,
lon:data[0].lon

}

}

async function taodon(){

try{

let pickup =
document.getElementById(
"pickup"
).value

let destination =
document.getElementById(
"destination"
).value

if(
pickup=="" ||
destination==""
){

alert("Nhập địa chỉ")

return

}

let p =
pickup.split(",")

let lat1 =
parseFloat(p[0])

let lon1 =
parseFloat(p[1])

let des =
await timtoado(destination)

let lat2 =
des.lat

let lon2 =
des.lon

let routeUrl =

`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`

let response =
await fetch(routeUrl)

let data =
await response.json()

let km =
(
data.routes[0].distance
/1000
).toFixed(1)

let gia =
Number(
document.getElementById(
"vehicle"
).value
)

let tong =
Math.floor(km * gia)

document.getElementById(
"result"
).innerHTML =

`

<div class="big">

${tong.toLocaleString()}đ

</div>

<br>

📏 Khoảng cách thật:
${km} km

<br><br>

🚖 Đang tìm tài xế

`

L.marker([lat2,lon2])
.addTo(map)

map.setView([lat2,lon2],13)

}
catch(e){

alert("Không tìm được địa điểm")

}

}

</script>

</body>
</html>
