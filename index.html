<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NamRice Auto</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:
linear-gradient(
180deg,
#f3f7f5,
#e7edf2
);

color:#222;

}

.top{

background:
linear-gradient(
135deg,
#00c853,
#009624
);

padding:22px;

color:white;

box-shadow:
0 6px 20px rgba(0,0,0,.2);

}

.logo{

font-size:32px;
font-weight:bold;

}

.sub{

margin-top:5px;
opacity:.9;

}

.container{

padding:12px;

}

.card{

background:white;

border-radius:24px;

padding:18px;

margin-bottom:16px;

box-shadow:
0 6px 25px rgba(0,0,0,.08);

}

.title{

font-size:24px;

font-weight:bold;

margin-bottom:14px;

}

input,
select,
textarea{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:16px;

background:#f2f3f5;

font-size:16px;

}

textarea{

height:90px;

resize:none;

}

.btn{

width:100%;

padding:16px;

margin-top:12px;

border:none;

border-radius:16px;

font-size:17px;

font-weight:bold;

color:white;

}

.green{
background:#00c853;
}

.blue{
background:#0d6efd;
}

.orange{
background:#ff9800;
}

.red{
background:#ff3b30;
}

.gray{
background:#555;
}

.money{

font-size:30px;

font-weight:bold;

color:#00b84f;

margin-top:10px;

}

.status{

background:#f7f7f7;

padding:15px;

border-radius:16px;

margin-top:15px;

line-height:1.7;

}

#map{

height:420px;

border-radius:24px;

overflow:hidden;

box-shadow:
0 6px 20px rgba(0,0,0,.1);

}

.shipgrid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

.order{

background:#f8f8f8;

padding:15px;

border-radius:18px;

margin-top:12px;

}

.order-title{

font-weight:bold;

font-size:18px;

margin-bottom:10px;

}

.badge{

display:inline-block;

padding:8px 12px;

background:#00c853;

color:white;

border-radius:30px;

margin-top:10px;

font-size:14px;

}

.bottom{

height:50px;

}

</style>

</head>

<body>

<div class="top">

<div class="logo">
🌾 NamRice Auto
</div>

<div class="sub">
Đặt gạo • Giao hàng • GPS realtime
</div>

</div>

<div class="container">

<!-- DAT GAO -->

<div class="card">

<div class="title">
📦 Đặt gạo
</div>

<input
id="sdt"
placeholder="📞 Số điện thoại khách"
/>

<select id="gao">

<option value="18000">
🌾 Gạo ST25 - 18.000đ/kg
</option>

<option value="22000">
🌾 Gạo Nhật - 22.000đ/kg
</option>

<option value="26000">
🌾 Gạo thơm cao cấp - 26.000đ/kg
</option>

</select>

<input
id="kg"
type="number"
value="5"
placeholder="Số kg"
/>

<input
id="diachi"
placeholder="📍 Địa chỉ giao hàng"
/>

<textarea
placeholder="📝 Ghi chú cho shipper..."
></textarea>

<select id="pay">

<option>
💵 Tiền mặt
</option>

<option>
🏦 Chuyển khoản
</option>

</select>

<button
class="btn green"
onclick="taodon()"
>
🛒 ĐẶT GẠO NGAY
</button>

<div
id="tongtien"
class="status"
>

Chưa có đơn hàng

</div>

</div>

<!-- SHIPPER -->

<div class="card">

<div class="title">
🛵 Đơn shipper
</div>

<div id="danhsachdon">

<div class="order">

<div class="order-title">
📦 Đơn mới
</div>

📍 Máy bán gạo NamRice
<br><br>

💰 105.000đ
<br><br>

<button
class="btn blue"
onclick="nhandon()"
>
📥 Nhận đơn
</button>

</div>

</div>

</div>

<!-- DIEU KHIEN -->

<div class="card">

<div class="title">
🚚 Điều khiển shipper
</div>

<div class="shipgrid">

<button
class="btn blue"
onclick="daden()"
>
📍 Đã đến
</button>

<button
class="btn orange"
onclick="laygao()"
>
🌾 Lấy gạo
</button>

<button
class="btn green"
onclick="giaohang()"
>
🛵 Đi giao
</button>

<button
class="btn red"
onclick="hoanthanh()"
>
✅ Hoàn thành
</button>

</div>

<button
class="btn gray"
onclick="goikhach()"
>
📞 Gọi khách
</button>

<div
id="shipstatus"
class="status"
>

Chưa có hoạt động

</div>

</div>

<!-- MAP -->

<div id="map"></div>

<div class="bottom"></div>

</div>

<script>

let tong = 0

let map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

let currentLat = 10.0452
let currentLon = 105.7469

navigator.geolocation.getCurrentPosition((pos)=>{

currentLat =
pos.coords.latitude

currentLon =
pos.coords.longitude

L.marker([
currentLat,
currentLon
]).addTo(map)

.bindPopup(
"📍 Vị trí hiện tại"
)

map.setView([
currentLat,
currentLon
],15)

})

function taodon(){

const kg =
Number(
document.getElementById("kg").value
)

const gia =
Number(
document.getElementById("gao").value
)

const tiengao =
kg * gia

const ship =
15000

tong =
tiengao + ship

document.getElementById(
"tongtien"
).innerHTML =

`
📦 Tiền gạo

<div class="money">
${tiengao.toLocaleString()}đ
</div>

<br>

🛵 Phí ship:
${ship.toLocaleString()}đ

<br><br>

💰 Tổng thanh toán

<div class="money">
${tong.toLocaleString()}đ
</div>

<div class="badge">
⏳ Đang chờ shipper
</div>
`

}

function nhandon(){

document.getElementById(
"shipstatus"
).innerHTML =

`
📥 Shipper đã nhận đơn
<br><br>

🗺️ Đang chỉ đường tới máy bán gạo
`

chidduongmay()

}

function daden(){

document.getElementById(
"shipstatus"
).innerHTML =

`
📍 Đã đến máy bán gạo
<br><br>

🌾 Sẵn sàng lấy gạo
`

}

function laygao(){

fetch("/mo")

document.getElementById(
"shipstatus"
).innerHTML =

`
🌾 Đang lấy gạo
<br><br>

🔓 ESP32 đã mở khóa
<br><br>

📦 Gạo đang rơi xuống
`

}

function giaohang(){

document.getElementById(
"shipstatus"
).innerHTML =

`
🚚 Đang giao hàng
<br><br>

🗺️ Đang chỉ đường tới khách
`

chidduongkhach()

}

function hoanthanh(){

document.getElementById(
"shipstatus"
).innerHTML =

`
✅ Đã giao thành công
<br><br>

💵 Thu khách

<div class="money">
${tong.toLocaleString()}đ
</div>
`

}

function goikhach(){

const sdt =
document.getElementById("sdt").value

window.location.href =
"tel:" + sdt

}

function chidduongmay(){

L.Routing.control({

waypoints:[

L.latLng(
currentLat,
currentLon
),

L.latLng(
10.0452,
105.7469
)

],

routeWhileDragging:false

}).addTo(map)

}

function chidduongkhach(){

L.Routing.control({

waypoints:[

L.latLng(
currentLat,
currentLon
),

L.latLng(
10.03,
105.76
)

],

routeWhileDragging:false

}).addTo(map)

}

</script>

</body>
</html>
