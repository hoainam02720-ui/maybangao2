<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NamRice Auto</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#edf1f4;
}

header{
background:#00c73c;
padding:25px;
color:white;
font-weight:bold;
font-size:22px;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.sub{
font-size:16px;
margin-top:10px;
}

.box{
background:white;
margin:15px;
padding:20px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-top:12px;
font-size:18px;
background:#f1f3f6;
box-sizing:border-box;
}

button{
border:none;
border-radius:20px;
padding:18px;
font-size:22px;
font-weight:bold;
color:white;
margin-top:15px;
}

.green{background:#00c853;}
.blue{background:#1565ff;}
.orange{background:#ff9800;}
.red{background:#ff3d3d;}
.gray{background:#555;}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.bigprice{
font-size:55px;
font-weight:bold;
color:#00c853;
margin-top:20px;
}

.card{
background:#f5f7fb;
padding:20px;
border-radius:20px;
margin-top:15px;
font-size:20px;
}

#map{
height:450px;
border-radius:25px;
margin-top:20px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
font-size:18px;
box-shadow:0 -5px 10px rgba(0,0,0,0.1);
}

.slide{
width:100%;
}

</style>
</head>

<body>

<header>

🌾 NamRice Auto

<div class="sub">
Đặt xe • Giao gạo • Chở hàng • GPS realtime
</div>

</header>

<div class="box">

<div class="title">
🛒 Đặt đơn
</div>

<div class="grid">

<button class="green" onclick="chonMode('gao')">
🌾 Giao gạo
</button>

<button class="blue" onclick="chonMode('xe')">
🚕 Đặt xe
</button>

<button class="orange" onclick="chonMode('hang')">
📦 Chở hàng
</button>

</div>

<input id="sdt" placeholder="📞 Số điện thoại khách">

<div id="gaobox">

<select id="loaigao">
<option value="18000">🌾 ST25 - 18k/kg</option>
<option value="20000">🌾 Jasmine - 20k/kg</option>
</select>

<input id="kg" type="number" placeholder="Kg gạo">

</div>

<div id="xedon">

<button class="blue" onclick="layvitri()">
📍 Chia sẻ vị trí đón
</button>

<input id="diemdon" placeholder="📍 Điểm đón">

</div>

<div id="hangbox" style="display:none">

<input id="hanghoa" placeholder="📦 Loại hàng">

</div>

<input id="diemden" placeholder="🏁 Điểm đến">

<select id="loaixe">

<option value="8000">🛵 Xe máy - 8k/km</option>
<option value="13000">🚗 Xe 4 chỗ - 13k/km</option>
<option value="14000">🚙 Xe 6 chỗ - 14k/km</option>
<option value="13000">🚚 Xe tải 500kg - 13k/km</option>
<option value="14000">🚛 Xe tải 1 tấn - 14k/km</option>
<option value="16000">🚚 Xe tải 2.5 tấn - 16k/km</option>
<option value="18000">🚛 Xe tải 3.5 tấn - 18k/km</option>

</select>

<textarea id="ghichu" placeholder="📝 Ghi chú"></textarea>

<select id="thanhtoan">
<option>💵 Tiền mặt</option>
<option>🏦 Chuyển khoản</option>
</select>

<button class="green" style="width:100%" onclick="taodon()">
🛒 ĐẶT NGAY
</button>

<div class="card" id="tongbox">

Chưa có đơn

</div>

</div>

<div class="box">

<div class="title">
📦 Đơn đang chờ nhận
</div>

<div id="doncho">

Chưa có đơn

</div>

</div>

<div class="box">

<div class="title">
🛵 Shipper
</div>

<div class="grid">

<button class="blue" onclick="nhandon()">
📥 Nhận đơn
</button>

<button class="orange" onclick="datoi()">
📍 Đã đến
</button>

<button class="green" onclick="layhang()">
🌾 Lấy hàng
</button>

<button class="red" onclick="giaohang()">
🚚 Đi giao
</button>

<button class="gray" onclick="openMap()">
🗺 Maps
</button>

<button class="gray" onclick="goikhach()">
📞 Gọi khách
</button>

</div>

<button class="green" style="width:100%" onclick="hienthucodon()">
✅ Hoàn thành
</button>

<div id="hoanthanhbox"></div>

<div class="card" id="shipstatus">

🚚 Đang chờ nhận đơn

</div>

</div>

<div class="box">

<div class="title">
💰 Ví shipper
</div>

<div class="bigprice" id="vishipper">
245.000đ
</div>

<div class="card">

📈 Hôm nay: 7 chuyến<br><br>

💵 Hoa hồng: 15%<br><br>

🏦 Phí hệ thống: 1.5%

</div>

<button class="green" style="width:100%">
💸 Rút tiền
</button>

</div>

<div class="box">

<div class="title">
🗺 GPS Realtime
</div>

<div id="map"></div>

</div>

<div style="height:120px"></div>

<div class="bottom">

<div>🏠<br>Trang chủ</div>

<div>📦<br>Đơn</div>

<div>🛵<br>Shipper</div>

<div>💰<br>Ví</div>

<div>⚙️<br>Cài đặt</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>

let currentMode = "gao"

let map = L.map('map').setView([10.0452,105.7469],13)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map)

let markerKhach = null
let markerShipper = null
let routeControl = null

let currentDon = null

function chonMode(mode){

currentMode = mode

document.getElementById("gaobox").style.display="none"
document.getElementById("xedon").style.display="none"
document.getElementById("hangbox").style.display="none"

if(mode=="gao"){
document.getElementById("gaobox").style.display="block"
}

if(mode=="xe"){
document.getElementById("xedon").style.display="block"
}

if(mode=="hang"){
document.getElementById("hangbox").style.display="block"
document.getElementById("xedon").style.display="block"
}

}

function layvitri(){

navigator.geolocation.getCurrentPosition(pos=>{

let lat = pos.coords.latitude
let lon = pos.coords.longitude

document.getElementById("diemdon").value = lat + "," + lon

if(markerKhach){
map.removeLayer(markerKhach)
}

markerKhach = L.marker([lat,lon]).addTo(map)

map.setView([lat,lon],15)

})

}

function taodon(){

let xe = Number(document.getElementById("loaixe").value)

let km = Math.floor(Math.random()*8)+3

let ship = km * xe

let tong = ship

if(currentMode=="gao"){

let kg = Number(document.getElementById("kg").value)

let gia = Number(document.getElementById("loaigao").value)

tong = tong + (kg*gia)

}

document.getElementById("tongbox").innerHTML = `

<div style="font-size:30px;font-weight:bold">

${currentMode=="gao"?"🌾 ĐƠN GIAO GẠO":""}
${currentMode=="xe"?"🚕 ĐƠN ĐẶT XE":""}
${currentMode=="hang"?"📦 ĐƠN CHỞ HÀNG":""}

</div>

<div class="bigprice">
${tong.toLocaleString()}đ
</div>

📏 Khoảng cách: ${km} km

<br><br>

🚚 Đang tìm tài xế

`

document.getElementById("doncho").innerHTML = `

<div class="card">

${currentMode=="gao"?"🌾 Đơn giao gạo":""}
${currentMode=="xe"?"🚕 Đơn đặt xe":""}
${currentMode=="hang"?"📦 Đơn chở hàng":""}

<br><br>

📍 ${document.getElementById("diemdon").value || "Máy bán gạo A4"}

<br>

🏁 ${document.getElementById("diemden").value}

<br>

📏 ${km} km

<br>

💵 ${tong.toLocaleString()}đ

<br><br>

<button class="blue" style="width:100%" onclick="nhandon()">

📥 NHẬN ĐƠN

</button>

</div>

`

currentDon = {
tong:tong,
km:km
}

}

function nhandon(){

document.getElementById("shipstatus").innerHTML = `
📦 Đã nhận đơn<br><br>
🗺 Đang mở đường realtime
`

}

function datoi(){

document.getElementById("shipstatus").innerHTML = `
📍 Đã tới nơi lấy hàng
`

}

function layhang(){

fetch("/mo")

document.getElementById("shipstatus").innerHTML = `
🌾 Đang lấy gạo<br><br>
🔓 ESP32 đã mở khóa
`

}

function giaohang(){

document.getElementById("shipstatus").innerHTML = `
🚚 Đang giao hàng realtime
`

}

function openMap(){

window.open("https://www.google.com/maps")

}

function goikhach(){

let sdt = document.getElementById("sdt").value

window.location.href="tel:"+sdt

}

function hienthucodon(){

if(!currentDon) return

document.getElementById("hoanthanhbox").innerHTML = `

<div class="card">

<div style="font-size:28px;font-weight:bold">

💵 Tổng tiền cần thu

</div>

<div class="bigprice">

${currentDon.tong.toLocaleString()}đ

</div>

📏 Kéo thanh để hoàn thành

<br><br>

<input
type="range"
min="0"
max="100"
value="0"
class="slide"
oninput="checkdone(this.value)"
>

</div>

`

}

function checkdone(v){

if(v>=100){

let tong = currentDon.tong

let tru = tong*0.165

let shipperNhan = tong-tru

document.getElementById("shipstatus").innerHTML = `

✅ Giao thành công

<br><br>

💵 Đã thu khách: ${tong.toLocaleString()}đ

<br><br>

💸 Trừ hoa hồng + phí hệ thống: ${tru.toLocaleString()}đ

<br><br>

💰 Shipper nhận: ${shipperNhan.toLocaleString()}đ

`

}

}

</script>

</body>
</html>
