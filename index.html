<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAMRICE AUTO</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111827;
    color:white;
}

.header{
    background:linear-gradient(90deg,#16a34a,#22c55e);
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.card{
    background:#1f2937;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

button{
    margin-top:15px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.video{
    background:#374151;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

a{
    color:#4ade80;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
NAMRICE AUTO
</div>

<div class="container">

<div class="card">
<h2>UPLOAD VIDEO</h2>

<input type="text" placeholder="Nhập tiêu đề video">

<input type="file">

<button>UPLOAD VIDEO</button>
</div>

<div class="card">
<h2>VIDEO RANDOM</h2>

<div class="video">
🎥 Video 1
</div>

<div class="video">
🎥 Video 2
</div>

<div class="video">
🎥 Video 3
</div>

</div>

<div class="card">
<h2>GỌI SHIPPER</h2>

<button>GỌI XE GIAO GẠO</button>
</div>

</div>

</body>
</html>
