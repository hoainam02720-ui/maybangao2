<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NamRice Auto</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#f2f5f7;
color:#222;

}

.top{

background:
linear-gradient(
135deg,
#00b84f,
#009944
);

padding:20px;

color:white;

box-shadow:
0 4px 12px rgba(0,0,0,.2);

}

.logo{

font-size:30px;
font-weight:bold;

}

.sub{

opacity:.9;
margin-top:5px;

}

.container{

padding:12px;

}

.card{

background:white;

border-radius:20px;

padding:18px;

margin-bottom:15px;

box-shadow:
0 5px 18px rgba(0,0,0,.08);

}

.title{

font-size:22px;

font-weight:bold;

margin-bottom:15px;

}

input,
select,
textarea{

width:100%;

padding:14px;

border-radius:14px;

border:none;

background:#f3f3f3;

margin-top:12px;

font-size:16px;

}

textarea{

height:100px;

resize:none;

}

.btn{

padding:15px;

border:none;

border-radius:14px;

font-size:17px;

font-weight:bold;

margin-top:12px;

width:100%;

color:white;

}

.green{

background:#00b84f;

}

.blue{

background:#007bff;

}

.orange{

background:#ff9800;

}

.red{

background:#f44336;

}

.gray{

background:#666;

}

.status{

margin-top:15px;

padding:15px;

background:#f6f6f6;

border-radius:14px;

line-height:1.7;

}

.money{

font-size:28px;

font-weight:bold;

color:#00b84f;

margin-top:10px;

}

#map{

height:350px;

border-radius:20px;

overflow:hidden;

box-shadow:
0 5px 18px rgba(0,0,0,.1);

}

.shipper{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

.bottom-space{

height:50px;

}

</style>

</head>

<body>

<div class="top">

<div class="logo">
🌾 NamRice Auto
</div>

<div class="sub">
Đặt gạo • Giao hàng • GPS realtime
</div>

</div>

<div class="container">

<div class="card">

<div class="title">
📦 Đặt gạo
</div>

<input
id="sdt"
placeholder="📞 Số điện thoại khách"
/>

<select id="gao">

<option value="18000">
🌾 Gạo ST25 - 18.000đ/kg
</option>

<option value="22000">
🌾 Gạo Nhật - 22.000đ/kg
</option>

<option value="26000">
🌾 Gạo thơm cao cấp - 26.000đ/kg
</option>

</select>

<input
id="kg"
type="number"
value="5"
placeholder="Số kg"
/>

<input
id="diachi"
placeholder="📍 Địa chỉ giao hàng"
/>

<textarea
placeholder="📝 Ghi chú cho shipper..."
></textarea>

<select id="pay">

<option>
💵 Tiền mặt
</option>

<option>
🏦 Chuyển khoản
</option>

</select>

<button
class="btn green"
onclick="taodon()"
>
🛒 ĐẶT GẠO NGAY
</button>

<div
id="tongtien"
class="status"
>

Chưa có đơn hàng

</div>

</div>

<div class="card">

<div class="title">
🛵 Shipper
</div>

<div class="shipper">

<button
class="btn blue"
onclick="daden()"
>
📍 Đã đến
</button>

<button
class="btn orange"
onclick="laygao()"
>
🌾 Lấy gạo
</button>

<button
class="btn green"
onclick="giaohang()"
>
🚚 Đi giao
</button>

<button
class="btn red"
onclick="hoanthanh()"
>
✅ Hoàn thành
</button>

</div>

<button
class="btn gray"
onclick="goikhach()"
>
📞 Gọi khách
</button>

<div
id="shipstatus"
class="status"
>

Chưa có hoạt động

</div>

</div>

<div id="map"></div>

<div class="bottom-space"></div>

</div>

<script>

let tong = 0

let map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

navigator.geolocation.getCurrentPosition((pos)=>{

const lat =
pos.coords.latitude

const lon =
pos.coords.longitude

L.marker([lat,lon])
.addTo(map)

.bindPopup(
"📍 Vị trí hiện tại"
)

map.setView(
[lat,lon],
15
)

})

function taodon(){

const kg =
Number(
document.getElementById("kg").value
)

const gia =
Number(
document.getElementById("gao").value
)

const tiengao =
kg * gia

const ship =
15000

tong =
tiengao + ship

document.getElementById(
"tongtien"
).innerHTML =

`
<div>
📦 Tiền gạo:
</div>

<div class="money">
${tiengao.toLocaleString()}đ
</div>

<br>

<div>
🛵 Tiền ship:
${ship.toLocaleString()}đ
</div>

<br>

<div>
💰 Tổng thanh toán:
</div>

<div class="money">
${tong.toLocaleString()}đ
</div>

<br>

<div>
⏳ Đang chờ shipper...
</div>
`

}

function daden(){

document.getElementById(
"shipstatus"
).innerHTML =

`
✅ Shipper đã đến máy bán gạo
<br><br>

📍 Đang chuẩn bị lấy gạo
`

}

function laygao(){

fetch("/mo")

document.getElementById(
"shipstatus"
).innerHTML =

`
🌾 Đang lấy gạo...
<br><br>

🔓 ESP32 đã mở khóa
<br><br>

📦 Gạo đang rơi xuống
`

}

function giaohang(){

document.getElementById(
"shipstatus"
).innerHTML =

`
🚚 Đang đi giao hàng
<br><br>

🗺️ Bản đồ đang chỉ đường
`

}

function hoanthanh(){

document.getElementById(
"shipstatus"
).innerHTML =

`
✅ Giao thành công
<br><br>

💵 Thu khách:
<div class="money">
${tong.toLocaleString()}đ
</div>
`

}

function goikhach(){

const sdt =
document.getElementById("sdt").value

window.location.href =
"tel:" + sdt

}

</script>

</body>
</html>
