<!DOCTYPE html>
<html>
<head>
  <title>NamRice Auto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#111;
      color:white;
    }

    .top{
      background:linear-gradient(45deg,#00c853,#ffd600);
      padding:20px;
      font-size:28px;
      font-weight:bold;
      text-align:center;
      color:black;
    }

    .box{
      padding:20px;
    }

    input,button{
      width:100%;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:18px;
    }

    button{
      background:#00c853;
      color:white;
      font-weight:bold;
    }

    .card{
      background:#222;
      padding:15px;
      border-radius:15px;
      margin-top:20px;
    }

    .ship{
      background:#ff9800;
    }

    a{
      color:#00e5ff;
      text-decoration:none;
      font-size:20px;
    }
  </style>
</head>

<body>

<div class="top">
  NAMRICE AUTO
</div>

<div class="box">

  <div class="card">
    <h2>UPLOAD VIDEO</h2>

    <input type="text" placeholder="Nhập tiêu đề video">

    <input type="file">

    <button>UPLOAD VIDEO</button>
  </div>

  <div class="card ship">
    <h2>GỌI SHIPPER</h2>

    <input type="text" placeholder="Địa chỉ giao gạo">

    <button>GỌI XE</button>
  </div>

  <div class="card">
    <a href="/videos">XEM VIDEO</a>
  </div>

</div>

</body>
</html>
