<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>NamRice Maps Test</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
    }

    #map{
      width:100%;
      height:500px;
    }

    .box{
      padding:10px;
      background:#f2f2f2;
    }

    input{
      width:250px;
      padding:10px;
      margin:5px;
    }

    button{
      padding:10px 20px;
    }

  </style>
</head>

<body>

<div class="box">

  <input
    id="from"
    placeholder="Điểm bắt đầu"
  >

  <input
    id="to"
    placeholder="Điểm kết thúc"
  >

  <button onclick="tinhKhoangCach()">

    TÍNH KHOẢNG CÁCH

  </button>

  <h2 id="ketqua"></h2>

</div>

<div id="map"></div>

<script>

let map;

let directionsService;

let directionsRenderer;

function initMap(){

  map = new google.maps.Map(
    document.getElementById("map"),
    {
      center:{
        lat:10.0452,
        lng:105.7469
      },
      zoom:13
    }
  );

  directionsService =
    new google.maps.DirectionsService();

  directionsRenderer =
    new google.maps.DirectionsRenderer();

  directionsRenderer.setMap(map);

}

function tinhKhoangCach(){

  const from =
    document.getElementById("from").value;

  const to =
    document.getElementById("to").value;

  directionsService.route(

    {
      origin:from,

      destination:to,

      travelMode:
        google.maps.TravelMode.DRIVING

    },

    function(response,status){

      if(status === "OK"){

        directionsRenderer.setDirections(response);

        const route =
          response.routes[0].legs[0];

        document.getElementById("ketqua")
        .innerHTML =

          "Khoảng cách: " +
          route.distance.text +

          " | Thời gian: " +

          route.duration.text;

      }

      else{

        alert(
          "Lỗi: " + status
        );

      }

    }

  );

}

</script>

<script async defer

src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCMeXJNHIH36FqBIPQaC_Q_j5dKwFLsGbA&callback=initMap">

</script>

</body>
</html>
