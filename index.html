<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta

<title>NamRice Auto</title>

<link

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#edf2f7;
padding-bottom:120px;
}

.topbar{

background:
linear-gradient(
135deg,
#00c853,
#00a63e
);

padding:25px;

color:white;

box-shadow:
0 4px 20px rgba(0,0,0,.2);

}

.logo{

font-size:50px;

font-weight:bold;

}

.sub{

margin-top:5px;

font-size:18px;

}

.container{
padding:14px;
}

.card{

background:white;

padding:18px;

border-radius:30px;

margin-bottom:18px;

box-shadow:
0 5px 25px rgba(0,0,0,.08);

}

.title{

font-size:28px;

font-weight:bold;

margin-bottom:15px;

}

input,
select,
textarea{

width:100%;

padding:18px;

border:none;

background:#f2f4f8;

border-radius:22px;

font-size:17px;

margin-top:12px;

}

textarea{
height:110px;
resize:none;
}

.btn{

width:100%;

padding:18px;

border:none;

border-radius:22px;

margin-top:12px;

font-size:22px;

font-weight:bold;

color:white;

}

.green{
background:#00c853;
}

.blue{
background:#1565ff;
}

.orange{
background:#ff9800;
}

.red{
background:#ff3b30;
}

.gray{
background:#555;
}

.row{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

.money{

font-size:55px;

font-weight:bold;

color:#00c853;

margin-top:20px;

}

.status{

background:#f7f7f7;

padding:18px;

border-radius:20px;

margin-top:15px;

line-height:2;

font-size:18px;

}

#map{

height:450px;

border-radius:25px;

overflow:hidden;

margin-top:15px;

}

.orderItem{

background:#f5f7fa;

padding:18px;

border-radius:20px;

margin-top:12px;

}

.bottomnav{

position:fixed;

bottom:0;

left:0;

right:0;

background:white;

display:flex;

justify-content:space-around;

padding:12px;

box-shadow:
0 -5px 20px rgba(0,0,0,.1);

z-index:999;

}

.nav{

text-align:center;

font-size:14px;

color:#555;

}

.sliderdone{

width:100%;

margin-top:20px;

}

</style>

</head>
