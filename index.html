<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Máy Bán Gạo Online</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#222;
    }

    .header{
      background:linear-gradient(135deg,#0f9b0f,#38ef7d);
      color:white;
      padding:30px 20px;
      text-align:center;
    }

    .header h1{
      font-size:32px;
      margin-bottom:10px;
    }

    .header p{
      font-size:18px;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:200px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card h2{
      margin-bottom:10px;
      color:#0f9b0f;
    }

    .price{
      font-size:24px;
      font-weight:bold;
      margin:15px 0;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#0f9b0f;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0b7d0b;
    }

    .footer{
      text-align:center;
      padding:30px;
      margin-top:40px;
      background:#111;
      color:white;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌾 Máy Bán Gạo Online</h1>
    <p>Gạo sạch Vĩnh Long - bán tự động 24/7</p>
  </div>

  <div class="container">

    <div class="products">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?q=80&w=1200&auto=format&fit=crop" />

        <div class="card-content">
          <h2>Gạo ST25</h2>
          <p>Thơm dẻo, hạt dài, cơm mềm.</p>

          <div class="price">25.000đ / kg</div>
<a href="https://img.vietqr.io/image/sacombank-070122688893-compact2.png?amount=120000&addInfo=Mua%20gao%20ST25&accountName=TRAN%20HOAI%20NAM" target="_blank">
  <button>Mua ngay</button>
</a>
          >
        </div>
      </div>


      <div class="card">
        <img src="https://images.unsplash.com/photo-1536304447766-da0ed4ce1b73?q=80&w=1200&auto=format&fit=crop" />

        <div class="card-content">
          <h2>Gạo Jasmine</h2>
          <p>Mùi thơm nhẹ, cơm ngon mỗi ngày.</p>

          <div class="price">22.000đ / kg</div>

          <button onclick="mua('Gạo Jasmine')">
            Mua ngay
          </button>
        </div>
      </div>


      <div class="card">
        <img src="https://images.unsplash.com/photo-1516684732162-798a0062be99?q=80&w=1200&auto=format&fit=crop" />

        <div class="card-content">
          <h2>Gạo Nếp</h2>
          <p>Dẻo ngon, thích hợp nấu xôi.</p>

          <div class="price">30.000đ / kg</div>

          <button onclick="mua('Gạo Nếp')">
            Mua ngay
          </button>
        </div>
      </div>

    </div>

  </div>

  <div class="footer">
    © 2026 Máy bán gạo online - Trần Hoài Nam
  </div>


  <script>
    function mua(tenGao){
      alert('Bạn đã chọn: ' + tenGao + '\n\nBước tiếp theo sẽ là thanh toán QR 😄');
    }
  </script>

</body>
</html>
