<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAMRICE AUTO</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:linear-gradient(90deg,#16a34a,#22c55e);
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

h2{
font-size:30px;
}

input,button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:20px;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
}

.online{
background:#16a34a;
}

#gps{
margin-top:15px;
font-size:20px;
color:#4ade80;
}

.order{
background:#334155;
padding:15px;
border-radius:15px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
NAMRICE AUTO
</div>

<div class="container">

<div class="card">

<h2>🛵 SHIPPER ĐĂNG NHẬP</h2>

<input type="text" placeholder="Tên shipper">

<input type="text" placeholder="Số điện thoại">

<button class="online" onclick="batGPS()">
BẬT ONLINE NHẬN ĐƠN
</button>

<div id="gps">
GPS chưa bật
</div>

</div>

<div class="card">

<h2>🚚 ĐƠN HÀNG GẦN BẠN</h2>

<div class="order">

📍 Lấy hàng: Máy bán gạo Bình Minh

<br><br>

🏠 Giao đến: Cần Thơ

<br><br>

📦 Gạo ST25 - 10kg

<br><br>

<button onclick="nhanDon()">
NHẬN ĐƠN
</button>

</div>

</div>

</div>

<script>

function batGPS(){

navigator.geolocation.getCurrentPosition(function(pos){

document.getElementById("gps").innerHTML =
"📍 GPS: " +
pos.coords.latitude +
" , " +
pos.coords.longitude

alert("Đã bật online nhận đơn")

})

}

function nhanDon(){

window.open(
"https://maps.google.com",
"_blank"
)

alert("Đã nhận đơn 🚚")

}

</script>

</body>
</html>
