<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NamRice Auto</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#eef3f8;
padding-bottom:120px;
}

.topbar{

background:
linear-gradient(
135deg,
#00c853,
#00a63e
);

padding:22px;

color:white;

font-size:32px;

font-weight:bold;

box-shadow:
0 5px 20px rgba(0,0,0,.2);

}

.sub{

font-size:17px;

margin-top:5px;

opacity:.95;

}

.container{
padding:14px;
}

.card{

background:white;

border-radius:28px;

padding:18px;

margin-bottom:18px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}

.title{

font-size:24px;

font-weight:bold;

margin-bottom:15px;

}

input,
select,
textarea{

width:100%;

padding:16px;

border:none;

background:#f3f5f7;

border-radius:18px;

margin-top:12px;

font-size:16px;

}

textarea{
height:90px;
resize:none;
}

.btn{

width:100%;

padding:18px;

border:none;

border-radius:20px;

margin-top:12px;

font-size:18px;

font-weight:bold;

color:white;

}

.green{
background:#00c853;
}

.blue{
background:#0d6efd;
}

.orange{
background:#ff9800;
}

.red{
background:#ff3b30;
}

.gray{
background:#555;
}

.row{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

.money{

font-size:36px;

font-weight:bold;

color:#00b84f;

margin-top:12px;

}

.status{

background:#f6f6f6;

padding:18px;

border-radius:20px;

margin-top:15px;

line-height:1.8;

font-size:17px;

}

.badge{

display:inline-block;

padding:8px 15px;

background:#00c853;

color:white;

border-radius:30px;

margin-top:12px;

}

#map{

height:430px;

border-radius:25px;

overflow:hidden;

margin-top:15px;

}

.bottomnav{

position:fixed;

bottom:0;

left:0;

right:0;

background:white;

display:flex;

justify-content:space-around;

padding:12px;

box-shadow:
0 -5px 20px rgba(0,0,0,.1);

z-index:999;

}

.navbtn{

text-align:center;

font-size:14px;

color:#555;

}

.sliderdone{

width:100%;

margin-top:20px;

}

.arrowMarker{

font-size:40px;

}

</style>

</head>

<body>

<div class="topbar">

🌾 NamRice Auto

<div class="sub">
Giao gạo • Đặt xe • Chở hàng
</div>

</div>

<div class="container">

<div class="card">

<div class="title">
🛒 Chọn dịch vụ
</div>

<div class="row">

<button
class="btn green"
onclick="chonDichVu('gao')"
>
🌾 Giao gạo
</button>

<button
class="btn blue"
onclick="chonDichVu('xe')"
>
🚖 Đặt xe
</button>

<button
class="btn orange"
onclick="chonDichVu('hang')"
>
📦 Chở hàng
</button>

</div>

<input
id="sdt"
placeholder="📞 Số điện thoại"
/>

<!-- GIAO GAO -->

<div id="khungGao">

<select id="loaigao">

<option value="18000">
🌾 ST25 - 18k/kg
</option>

<option value="22000">
🌾 Gạo Nhật - 22k/kg
</option>

</select>

<input
id="kg"
type="number"
value="5"
placeholder="Số kg"
/>

<select id="loaixe">

<option value="8000">
🛵 Xe máy - 8k/km
</option>

<option value="13000">
🚗 Xe 4 chỗ - 13k/km
</option>

<option value="14000">
🚙 Xe 6 chỗ - 14k/km
</option>

</select>

<input
id="diachi"
placeholder="📍 Địa chỉ giao"
/>

</div>

<!-- DAT XE -->

<div
id="khungXe"
style="display:none"
>

<button
class="btn blue"
onclick="layvitri()"
>
📍 Chia sẻ vị trí đón
</button>

<input
id="diemdon"
placeholder="📍 Điểm đón"
/>

<input
id="diemden"
placeholder="🏁 Điểm đến"
/>

<select id="loaixekhach">

<option value="8000">
🛵 Xe máy - 8k/km
</option>

<option value="13000">
🚗 Xe 4 chỗ - 13k/km
</option>

<option value="14000">
🚙 Xe 6 chỗ - 14k/km
</option>

</select>

</div>

<!-- CHO HANG -->

<div
id="khungHang"
style="display:none"
>

<button
class="btn orange"
onclick="layvitri()"
>
📍 Chia sẻ vị trí lấy hàng
</button>

<input
id="layhang"
placeholder="📦 Nơi lấy hàng"
/>

<input
id="giaohang"
placeholder="🏁 Nơi giao hàng"
/>

<select id="loaixetai">

<option value="13000">
📦 500kg - 13k/km
</option>

<option value="14000">
🚛 1 tấn - 14k/km
</option>

<option value="16000">
🚚 2.5 tấn - 16k/km
</option>

<option value="18000">
🚛 3.5 tấn - 18k/km
</option>

</select>

</div>

<select id="pay">

<option>
💵 Tiền mặt
</option>

<option>
🏦 Chuyển khoản
</option>

</select>

<button
class="btn green"
onclick="taodon()"
>
🛒 ĐẶT NGAY
</button>

<div
id="bill"
class="status"
>

Chưa có đơn

</div>

</div>

<!-- SHIPPER -->

<div class="card">

<div class="title">
🛵 Shipper
</div>

<div class="row">

<button
class="btn blue"
onclick="nhandon()"
>
📥 Nhận đơn
</button>

<button
class="btn orange"
onclick="daden()"
>
📍 Đã đến
</button>

<button
class="btn green"
onclick="laygao()"
>
🌾 Lấy hàng
</button>

<button
class="btn red"
onclick="giaohangreal()"
>
🚚 Đi giao
</button>

</div>

<button
class="btn gray"
onclick="mobando()"
>
🗺️ Mở Google Maps
</button>

<button
class="btn gray"
onclick="goikhach()"
>
📞 Gọi khách
</button>

<button
class="btn green"
onclick="hoanthanh()"
>
✅ Hoàn thành
</button>

<div
id="shipstatus"
class="status"
>

🟢 Hệ thống sẵn sàng

</div>

</div>

<!-- VI -->

<div class="card">

<div class="title">
💰 Ví shipper
</div>

<div class="money">
245.000đ
</div>

<br>

📈 Hôm nay: 7 chuyến

<br>

💵 Hoa hồng: 15%

</div>

<!-- MAP -->

<div class="card">

<div class="title">
🗺️ GPS realtime
</div>

<div id="map"></div>

</div>

</div>

<!-- MENU -->

<div class="bottomnav">

<div class="navbtn">
🏠<br>Trang chủ
</div>

<div class="navbtn">
📦<br>Đơn
</div>

<div class="navbtn">
🛵<br>Shipper
</div>

<div class="navbtn">
💰<br>Ví
</div>

</div>

<script>

let currentService = "gao"

let tong = 0

const map =
L.map('map').setView(
[10.0452,105.7469],
13
)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

navigator.geolocation.watchPosition((pos)=>{

const lat =
pos.coords.latitude

const lon =
pos.coords.longitude

L.marker([lat,lon]).addTo(map)

map.setView([lat,lon],15)

})

function chonDichVu(loai){

currentService = loai

document.getElementById(
"khungGao"
).style.display = "none"

document.getElementById(
"khungXe"
).style.display = "none"

document.getElementById(
"khungHang"
).style.display = "none"

if(loai == "gao"){

document.getElementById(
"khungGao"
).style.display = "block"

}

if(loai == "xe"){

document.getElementById(
"khungXe"
).style.display = "block"

}

if(loai == "hang"){

document.getElementById(
"khungHang"
).style.display = "block"

}

}

function layvitri(){

navigator.geolocation.getCurrentPosition((pos)=>{

const lat =
pos.coords.latitude

const lon =
pos.coords.longitude

document.getElementById(
"diemdon"
).value =
lat + "," + lon

})

}

function taodon(){

let giaKm = 0

let km = 5

if(currentService == "gao"){

giaKm =
Number(
document.getElementById(
"loaixe"
).value
)

const giaGao =
Number(
document.getElementById(
"loaigao"
).value
)

const kg =
Number(
document.getElementById(
"kg"
).value
)

tong =
(giaKm * km) +
(giaGao * kg)

document.getElementById(
"bill"
).innerHTML =

`
🌾 ĐƠN GIAO GẠO

<div class="money">
${tong.toLocaleString()}đ
</div>

📦 Đang tìm shipper
`

}

if(currentService == "xe"){

giaKm =
Number(
document.getElementById(
"loaixekhach"
).value
)

tong = giaKm * km

document.getElementById(
"bill"
).innerHTML =

`
🚖 ĐƠN ĐẶT XE

<div class="money">
${tong.toLocaleString()}đ
</div>

🚕 Đang tìm tài xế
`

}

if(currentService == "hang"){

giaKm =
Number(
document.getElementById(
"loaixetai"
).value
)

tong = giaKm * km

document.getElementById(
"bill"
).innerHTML =

`
📦 ĐƠN CHỞ HÀNG

<div class="money">
${tong.toLocaleString()}đ
</div>

🚛 Đang tìm xe tải
`

}

}

function nhandon(){

document.getElementById(
"shipstatus"
).innerHTML =

`
📥 Đã nhận đơn
<br><br>
🗺️ Đang tới điểm lấy hàng
`

}

function daden(){

document.getElementById(
"shipstatus"
).innerHTML =

`
📍 Đã tới nơi
`

}

function laygao(){

fetch("/mo")

document.getElementById(
"shipstatus"
).innerHTML =

`
🔓 Đã mở khóa
<br><br>
📦 Đang lấy hàng
`

}

function giaohangreal(){

document.getElementById(
"shipstatus"
).innerHTML =

`
🚚 Đang giao hàng
<br><br>
🗺️ Google Maps đang dẫn đường
`

}

function mobando(){

window.open(
"https://maps.google.com"
)

}

function goikhach(){

const sdt =
document.getElementById(
"sdt"
).value

window.location.href =
"tel:" + sdt

}

function hoanthanh(){

document.getElementById(
"shipstatus"
).innerHTML =

`
💵 Tổng cần thu

<div class="money">
${tong.toLocaleString()}đ
</div>

<input
class="sliderdone"
type="range"
min="0"
max="100"
value="0"
oninput="checkdone(this.value)"
>
`

}

function checkdone(v){

if(v >= 100){

document.getElementById(
"shipstatus"
).innerHTML =

`
✅ Hoàn thành đơn

<div class="money">
${tong.toLocaleString()}đ
</div>
`

}

}

</script>

</body>
</html>
