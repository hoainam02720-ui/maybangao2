<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAMRICE AUTO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:linear-gradient(90deg,#16a34a,#22c55e);
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:18px;
box-sizing:border-box;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
}

.order{
background:#334155;
padding:15px;
border-radius:15px;
margin-top:20px;
}

.history{
background:#14532d;
padding:15px;
border-radius:15px;
margin-top:20px;
}

#gps{
margin-top:15px;
color:#4ade80;
}

a{
color:#4ade80;
text-decoration:none;
font-size:20px;
}

</style>

</head>

<body>

<div class="header">

NAMRICE AUTO

</div>

<div class="container">

<div class="card">

<h2>🛒 ĐẶT GẠO</h2>

<input id="tengao" placeholder="Tên khách">

<input id="sdtgao" placeholder="Số điện thoại">

<input id="diachigao" placeholder="Địa chỉ giao gạo">

<select id="loaigao">

<option>ST25 5KG - 120K</option>

<option>ST25 10KG - 240K</option>

<option>Gạo thơm 5KG - 100K</option>

</select>

<button onclick="datGao()">

ĐẶT GẠO

</button>

</div>

<div class="card">

<h2>🚖 ĐẶT XE</h2>

<input id="tenxe" placeholder="Tên khách">

<input id="sdtxe" placeholder="Số điện thoại">

<input id="diemdi" placeholder="Điểm đón">

<input id="diemden" placeholder="Điểm đến">

<select id="loaixe">

<option>🛵 Xe máy</option>

<option>🚗 Ô tô 4 chỗ</option>

<option>🚙 Ô tô 7 chỗ</option>

</select>

<button onclick="tinhTien()">

💰 TÍNH GIÁ

</button>

<div id="ketqua"></div>

<button onclick="datXe()">

🚖 ĐẶT XE

</button>

</div>

<div class="card">

<h2>🛵 SHIPPER ONLINE</h2>

<button onclick="batGPS()">

BẬT GPS NHẬN ĐƠN

</button>

<div id="gps">

GPS chưa bật

</div>

</div>

<div class="card">

<h2>🚚 ĐƠN HÀNG</h2>

<div id="donhang"></div>

</div>

<div class="card">

<h2>📜 LỊCH SỬ</h2>

<div id="lichsu"></div>

</div>

</div>

<script>

let donhang =
JSON.parse(
localStorage.getItem("donhang")
) || []

function luu(){

localStorage.setItem(
"donhang",
JSON.stringify(donhang)
)

}

function batGPS(){

navigator.geolocation.getCurrentPosition(

(pos)=>{

document.getElementById("gps").innerHTML =

"📍 GPS: " +

pos.coords.latitude +

" , " +

pos.coords.longitude

alert("Đã bật online")

}

)

}

function datGao(){

const ten =
document.getElementById("tengao").value

const sdt =
document.getElementById("sdtgao").value

const diachi =
document.getElementById("diachigao").value

const gao =
document.getElementById("loaigao").value

if(
ten == "" ||
sdt == "" ||
diachi == ""
){

alert("Nhập đầy đủ thông tin")

return

}

donhang.push({

loai:"gao",

ten,

sdt,

diachi,

gao,

trangthai:"🕒 Chờ shipper",

hoanthanh:false

})

luu()

hienThi()

alert("Đặt gạo thành công")

}

function tinhTien(){

const diemdi =
document.getElementById("diemdi").value

const diemden =
document.getElementById("diemden").value

const loaixe =
document.getElementById("loaixe").value

if(
diemdi == "" ||
diemden == ""
){

alert("Nhập điểm đi và điểm đến")

return

}

const km =
Math.floor(Math.random()*12)+1

let tien = 0

if(loaixe == "🛵 Xe máy"){

tien = km * 7000

}

if(loaixe == "🚗 Ô tô 4 chỗ"){

if(km <= 2){

tien = 28000

}else{

tien =
28000 + ((km - 2) * 12000)

}

}

if(loaixe == "🚙 Ô tô 7 chỗ"){

if(km <= 2){

tien = 35000

}else{

tien =
35000 + ((km - 2) * 15000)

}

}

window.kmTam = km
window.tienTam = tien

document.getElementById("ketqua").innerHTML =

`

<br>

📏 Khoảng cách:
<b>${km} km</b>

<br><br>

💰 Giá tiền:
<b>${tien.toLocaleString()}đ</b>

`

}

function datXe(){

const ten =
document.getElementById("tenxe").value

const sdt =
document.getElementById("sdtxe").value

const diemdi =
document.getElementById("diemdi").value

const diemden =
document.getElementById("diemden").value

const loaixe =
document.getElementById("loaixe").value

if(
ten == "" ||
sdt == "" ||
diemdi == "" ||
diemden == ""
){

alert("Nhập đầy đủ thông tin")

return

}

if(!window.kmTam){

alert("Bấm tính giá trước")

return

}

donhang.push({

loai:"xe",

ten,

sdt,

diemdi,

diemden,

loaixe,

km:window.kmTam,

tien:window.tienTam,

trangthai:"🕒 Chờ tài xế",

hoanthanh:false

})

luu()

hienThi()

alert("Đặt xe thành công")

}

function hienThi(){

let html = ""

let lichsu = ""

donhang.forEach((don,index)=>{

if(don.hoanthanh == false){

if(don.loai == "gao"){

html += `

<div class="order">

👤 ${don.ten}

<br><br>

<a href="tel:${don.sdt}">

📞 ${don.sdt}

</a>

<br><br>

🏠 ${don.diachi}

<br><br>

🍚 ${don.gao}

<br><br>

📌 ${don.trangthai}

<br><br>

<button onclick="nhanDon(${index})">

NHẬN ĐƠN

</button>

<button onclick="moKho(${index})">

MỞ KHO GẠO

</button>

<button onclick="giaoHang(${index})">

ĐI GIAO

</button>

<button onclick="hoanThanh(${index})">

ĐÃ GIAO XONG

</button>

</div>

`

}

if(don.loai == "xe"){

html += `

<div class="order">

👤 ${don.ten}

<br><br>

<a href="tel:${don.sdt}">

📞 ${don.sdt}

</a>

<br><br>

📍 ${don.diemdi}

<br><br>

🏁 ${don.diemden}

<br><br>

🚗 ${don.loaixe}

<br><br>

📏 ${don.km} km

<br><br>

💰 ${don.tien.toLocaleString()}đ

<br><br>

📌 ${don.trangthai}

<br><br>

<button onclick="nhanDon(${index})">

NHẬN CUỐC

</button>

<button onclick="daDen(${index})">

ĐÃ ĐẾN

</button>

<button onclick="diDiemDen('${don.diemden}')">

ĐI ĐIỂM ĐẾN

</button>

<button onclick="hoanThanh(${index})">

HOÀN THÀNH

</button>

</div>

`

}

}else{

lichsu += `

<div class="history">

✅ ${don.ten}

<br><br>

${don.trangthai}

</div>

`

}

})

document.getElementById("donhang").innerHTML =
html

document.getElementById("lichsu").innerHTML =
lichsu

}

function nhanDon(index){

donhang[index].trangthai =
"🚚 Đang đến"

luu()

hienThi()

}

function moKho(index){

donhang[index].trangthai =
"🔓 Đã mở kho"

alert("Mở khóa ô gạo")

luu()

hienThi()

}

function giaoHang(index){

let diachi =
donhang[index].diachi

location.href =

"https://www.google.com/maps/search/?api=1&query=" +

encodeURIComponent(diachi)

}

function daDen(index){

alert(
"Gọi khách: " +
donhang[index].sdt
)

donhang[index].trangthai =
"📍 Đã đến"

luu()

hienThi()

}

function diDiemDen(diachi){

location.href =

"https://www.google.com/maps/search/?api=1&query=" +

encodeURIComponent(diachi)

}

function hoanThanh(index){

donhang[index].trangthai =
"✅ Hoàn thành"

donhang[index].hoanthanh = true

luu()

hienThi()

}

hienThi()

</script>

</body>
</html>
