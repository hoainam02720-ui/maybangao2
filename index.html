<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>NamRice Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
margin:0;
font-family:Arial;
}

.top{
padding:10px;
background:white;
position:relative;
z-index:1000;
}

input{
padding:10px;
width:180px;
}

button{
padding:10px;
}

#map{
height:85vh;
width:100%;
}

#result{
padding:10px;
font-size:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="top">

<input id="from"
placeholder="Điểm đi">

<input id="to"
placeholder="Điểm đến">

<button onclick="calculate()">
TÍNH KHOẢNG CÁCH
</button>

</div>

<div id="result"></div>

<div id="map"></div>

<script>

let map = L.map('map').setView([10.0452,105.7469],8);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

let routeLine;

async function calculate(){

let from =
document.getElementById("from").value + ", Việt Nam";

let to =
document.getElementById("to").value + ", Việt Nam";

let fromData = await fetch(
'https://nominatim.openstreetmap.org/search?format=json&q='
+ encodeURIComponent(from)
);

let fromJson = await fromData.json();

let toData = await fetch(
'https://nominatim.openstreetmap.org/search?format=json&q='
+ encodeURIComponent(to)
);

let toJson = await toData.json();

if(fromJson.length==0 || toJson.length==0){

alert("Không tìm thấy địa điểm");
return;

}

let lat1 = fromJson[0].lat;
let lon1 = fromJson[0].lon;

let lat2 = toJson[0].lat;
let lon2 = toJson[0].lon;

if(routeLine){

map.removeLayer(routeLine);

}

let routeData = await fetch(
`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`
);

let routeJson = await routeData.json();

let coords =
routeJson.routes[0].geometry.coordinates;

let distance =
routeJson.routes[0].distance / 1000;

document.getElementById("result").innerHTML =
"Khoảng cách: " + distance.toFixed(2) + " km";

let latlngs = coords.map(c => [c[1],c[0]]);

routeLine = L.polyline(latlngs,{
color:'blue',
weight:5
}).addTo(map);

L.marker([lat1,lon1]).addTo(map);

L.marker([lat2,lon2]).addTo(map);

map.fitBounds(routeLine.getBounds());

}

</script>

</body>
</html>
