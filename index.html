<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAMRICE AUTO</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:linear-gradient(90deg,#16a34a,#22c55e);
padding:25px;
text-align:center;
font-size:38px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:25px;
margin-bottom:25px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h2{
font-size:40px;
margin-bottom:20px;
}

input,select{
width:100%;
padding:18px;
border:none;
border-radius:15px;
margin-top:15px;
font-size:22px;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:15px;
background:#22c55e;
color:white;
font-size:28px;
font-weight:bold;
margin-top:20px;
}

.note{
margin-top:15px;
font-size:22px;
color:#94a3b8;
}

.qr{
background:white;
padding:15px;
border-radius:20px;
text-align:center;
margin-top:20px;
}

img{
width:100%;
border-radius:15px;
}
</style>
</head>

<body>

<div class="header">
NAMRICE AUTO
</div>

<div class="container">

<div class="card">

<h2>🚚 GỌI GIAO GẠO</h2>

<input type="text" placeholder="Nhập địa chỉ lấy hàng">

<input type="text" placeholder="Nhập địa chỉ giao hàng">

<input type="text" placeholder="Số điện thoại khách">

<select>
<option>🛵 Shipper giao nhanh</option>
<option>🚚 Xe tải nhỏ</option>
<option>🚛 Xe tải lớn</option>
</select>

<button onclick="goiXe()">
GỌI XE NGAY
</button>

<div class="note">
Shipper sẽ liên hệ sau khi đặt xe
</div>

</div>

<div class="card">

<h2>💳 QUÉT MÃ THANH TOÁN</h2>

<div class="qr">

<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=NAMRICEAUTO" />

</div>

<div class="note">
Khách quét mã chuyển khoản để mở máy bán gạo
</div>

</div>

</div>

<script>
function goiXe(){
alert("Đã gửi yêu cầu gọi xe 🚚")
}
</script>

</body>
</html>
