<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>NamRice Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
margin:0;
font-family:Arial;
}

.top{
padding:10px;
background:white;
z-index:1000;
}

input{
padding:10px;
width:180px;
}

button{
padding:10px;
}

#map{
height:85vh;
width:100%;
}

</style>
</head>

<body>

<div class="top">

<input id="from"
placeholder="Điểm đi">

<input id="to"
placeholder="Điểm đến">

<button onclick="calculate()">
TÍNH KHOẢNG CÁCH
</button>

<h2 id="distance"></h2>

</div>

<div id="map"></div>

<script>

var map = L.map('map').setView([10.0452,105.7469],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

var routeLine;

async function calculate(){

let from =
document.getElementById("from").value;

let to =
document.getElementById("to").value;

let res1 =
await fetch(
'https://nominatim.openstreetmap.org/search?format=json&q='
+ from
);

let data1 = await res1.json();

let res2 =
await fetch(
'https://nominatim.openstreetmap.org/search?format=json&q='
+ to
);

let data2 = await res2.json();

if(data1.length==0 || data2.length==0){
alert("Không tìm thấy địa điểm");
return;
}

let lat1 = data1[0].lat;
let lon1 = data1[0].lon;

let lat2 = data2[0].lat;
let lon2 = data2[0].lon;

let route =
await fetch(
`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`
);

let routeData =
await route.json();

let coords =
routeData.routes[0].geometry.coordinates;

let distance =
routeData.routes[0].distance / 1000;

let routeCoords =
coords.map(c => [c[1], c[0]]);

if(routeLine){
map.removeLayer(routeLine);
}

routeLine =
L.polyline(
routeCoords,
{
color:'blue',
weight:5
}
).addTo(map);

L.marker([lat1,lon1]).addTo(map);

L.marker([lat2,lon2]).addTo(map);

map.fitBounds(routeLine.getBounds());

document.getElementById("distance")
.innerHTML =
"Khoảng cách: "
+ distance.toFixed(2)
+ " km";

}

</script>

</body>
</html>
