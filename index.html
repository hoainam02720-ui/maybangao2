<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAMRICE AUTO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:linear-gradient(90deg,#16a34a,#22c55e);
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

h2{
font-size:30px;
}

input,select,button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:20px;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
}

.order{
background:#334155;
padding:15px;
border-radius:15px;
margin-top:20px;
}

#gps{
margin-top:15px;
font-size:20px;
color:#4ade80;
}

</style>

</head>

<body>

<div class="header">

NAMRICE AUTO

</div>

<div class="container">

<div class="card">

<h2>🛒 KHÁCH ĐẶT GẠO</h2>

<input id="ten" placeholder="Tên khách">

<input id="sdt" placeholder="Số điện thoại">

<input id="diachi" placeholder="Địa chỉ giao">

<select id="gao">

<option>ST25 5KG - 120K</option>

<option>ST25 10KG - 240K</option>

</select>

<button onclick="datGao()">

ĐẶT GẠO

</button>

</div>

<div class="card">

<h2>🛵 SHIPPER</h2>

<button onclick="batGPS()">

BẬT ONLINE NHẬN ĐƠN

</button>

<div id="gps">

GPS chưa bật

</div>

</div>

<div class="card">

<h2>🚚 ĐƠN HÀNG</h2>

<div id="donhang"></div>

</div>

</div>

<script>

let danhSachDon = JSON.parse(
localStorage.getItem("donhang")
) || []

function datGao(){

const ten =
document.getElementById("ten").value

const sdt =
document.getElementById("sdt").value

const diachi =
document.getElementById("diachi").value

const gao =
document.getElementById("gao").value

if(
ten == "" ||
sdt == "" ||
diachi == ""
){

alert("Nhập đầy đủ thông tin")

return

}

const don = {

ten: ten,

sdt: sdt,

diachi: diachi,

gao: gao,

trangthai: "Chờ shipper"

}

danhSachDon.push(don)

localStorage.setItem(
"donhang",
JSON.stringify(danhSachDon)
)

alert("Đặt gạo thành công ✅")

document.getElementById("ten").value = ""

document.getElementById("sdt").value = ""

document.getElementById("diachi").value = ""

hienThiDon()

}

function batGPS(){

navigator.geolocation.getCurrentPosition(

(pos)=>{

document.getElementById("gps").innerHTML =

"📍 GPS: " +

pos.coords.latitude +

" , " +

pos.coords.longitude

alert("Đã bật online")

},

()=>{

alert("Chưa bật GPS")

}

)

}

function hienThiDon(){

const ds = JSON.parse(
localStorage.getItem("donhang")
) || []

let html = ""

ds.forEach((don,index)=>{

html += `

<div class="order">

👤 ${don.ten}

<br><br>

📞 ${don.sdt}

<br><br>

🏠 ${don.diachi}

<br><br>

📦 ${don.gao}

<br><br>

📌 ${don.trangthai}

<br><br>

<button onclick="nhanDon(${index})">

NHẬN ĐƠN

</button>

<button onclick="moKho(${index})">

MỞ KHO GẠO

</button>

<button onclick="giaoHang(${index})">

ĐI GIAO

</button>

<button onclick="giaoXong(${index})">

ĐÃ GIAO XONG

</button>

</div>

`

})

document.getElementById("donhang").innerHTML =
html

}

function nhanDon(index){

danhSachDon[index].trangthai =
"Đang đến máy lấy gạo 🚚"

localStorage.setItem(
"donhang",
JSON.stringify(danhSachDon)
)

window.open(
"https://maps.google.com",
"_blank"
)

hienThiDon()

}

function moKho(index){

danhSachDon[index].trangthai =
"Đã lấy gạo 🌾"

localStorage.setItem(
"donhang",
JSON.stringify(danhSachDon)
)

alert("Đang mở khóa ô A1 🔓")

hienThiDon()

}

function giaoHang(index){

danhSachDon[index].trangthai =
"Đang giao hàng 🛵"

localStorage.setItem(
"donhang",
JSON.stringify(danhSachDon)
)

window.open(
"https://maps.google.com",
"_blank"
)

hienThiDon()

}

function giaoXong(index){

danhSachDon[index].trangthai =
"Giao thành công ✅"

localStorage.setItem(
"donhang",
JSON.stringify(danhSachDon)
)

alert("Đã giao hàng xong")

hienThiDon()

}

hienThiDon()

</script>

</body>

</html>
